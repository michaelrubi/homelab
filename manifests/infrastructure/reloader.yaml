apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: stakater
  namespace: default
spec:
  interval: 1h
  url: https://stakater.github.io/stakater-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: default
spec:
  interval: 10m
  chart:
    spec:
      chart: reloader
      version: "1.3.x"
      sourceRef:
        kind: HelmRepository
        name: stakater
      interval: 10m
  values:
    reloader:
      # efficient watching of secrets
      watchGlobally: true
      deployment:
        # 2026-09-11: chart ships no resource requests, so this ran as
        # BestEffort -- first in line to be evicted under node pressure.
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "192Mi"
