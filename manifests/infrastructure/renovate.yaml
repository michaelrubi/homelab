apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: default
spec:
  schedule: "0 * * * *" # Runs every hour
  concurrencyPolicy: Forbid

  # 2026-09-12: KubeJobFailed had been firing on renovate-29791560 for
  # 19 days. The default failedJobsHistoryLimit of 1 keeps the most
  # recent failure forever, and `kube_job_failed > 0` has no age bound,
  # so a single bad run becomes a permanent hourly notification long
  # after the cause is gone.
  #
  # ttlSecondsAfterFinished retires a finished Job after a day, which is
  # long enough to notice and investigate it. If the job is still broken
  # the next hourly run fails too and the alert comes straight back --
  # what clears is the zombie, not the signal.
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          containers:
            - name: renovate
              image: renovate/renovate:latest
              imagePullPolicy: IfNotPresent
              env:
                # Tell Renovate we are using Forgejo (uses Gitea platform logic)
                - name: RENOVATE_PLATFORM
                  value: "gitea"

                # Internal K8s Service URL (Fast & Secure)
                # Note: We append /api/v1 for the Renovate endpoint
                - name: RENOVATE_ENDPOINT
                  value: "http://forgejo-service.default.svc.cluster.local:3000/api/v1"

                # Explicit repo list — replaces autodiscover.
                # Excluded:
                #   michael/midday       — bun manager OOMs at 2 Gi
                #   michael/michael-rubi — default branch is 'master', autodiscover assumed 'main'
                # Extend this list to add more repos.
                - name: RENOVATE_AUTODISCOVER
                  value: "false"
                - name: RENOVATE_REPOS
                  value: '["michael/homelab"]'

                # The Identity used for commits
                - name: RENOVATE_GIT_AUTHOR
                  value: "Renovate Bot <renovate@rubiconetic.com>"

                # Secrets
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secrets # Ensure this matches your Secret name
                      key: RENOVATE_TOKEN

                # Optional: GitHub Token for fetching release notes/changelogs
                # (Renovate hits GitHub's public API to read changelogs even for private internal tools)
                - name: GITHUB_COM_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secrets
                      key: RENOVATE_GITHUB_TOKEN

              resources:
                requests:
                  memory: "512Mi"
                  cpu: "200m"
                limits:
                  memory: "4Gi"
                  cpu: "2000m"
          restartPolicy: Never
