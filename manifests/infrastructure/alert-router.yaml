# Alert router: a typed decision between Alertmanager and ntfy.
#
# The problem this solves is the one documented in monitoring.yaml and
# reliability-alerts.yaml from both directions. Alerts went to receiver "null"
# for five days and nobody noticed (2026-09-06 to 2026-09-11); the fix pointed
# everything at one ntfy topic, which is correct but means the warning tier now
# arrives on the phone at the same weight as a dead backup. A route that is
# either "silent" or "everything" has no setting where a human keeps reading it.
#
# So: warnings pass through a classifier that decides page / digest / suppress,
# and Jev (TypeSafe's decision model) supplies that decision as a typed answer
# with a calibrated probability. Calibration is the whole reason it is Jev and
# not a general LLM -- benchmarked 2026-09-20, a local 8B asked to emit its own
# confidence returned 0.95 for every input including the ones it got wrong, so
# gating on that number gates on nothing. Jev returned 0.25 to 1.00 and tracked
# difficulty, which is what makes "only suppress when sure" mean something.
#
# WHAT THIS DOES NOT TOUCH, on purpose:
#
#   Watchdog -> deadmansswitch   The dead-man's-switch is the layer that
#                                catches Prometheus itself dying. Putting a
#                                classifier in front of it would reintroduce
#                                exactly the single point of failure it exists
#                                to cover. It stays wired direct.
#
#   severity=critical -> ntfy-critical
#                                Critical always pages, unclassified, at full
#                                volume. A backup that has not run in 36h is
#                                not a judgement call.
#
# Only the default `ntfy` receiver -- warning and info, the tier that actually
# firehoses -- is routed through here.
#
# FAIL-OPEN IS THE CENTRAL RULE. Every error path forwards the alert. Jev
# unreachable, slow, rate-limited, returning something unparseable, key missing,
# confidence below threshold: all of them page. The failure mode of this service
# must be "as noisy as today", never "as silent as September 6". There is no
# code path that drops an alert because something broke.
#
# The code lives in its own repo, with tests for every fail-open path and a
# signed image: https://git.rubiconetic.com/michael/alert-router. It used to
# be a router.py inside a ConfigMap here. Renovate opens a PR for each new
# release, so an upgrade is reviewed like any other change.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-router
  namespace: monitoring
  annotations:
    # Restart on a change to the key or ntfy URL, without a manual rollout --
    # reloader is already running for exactly this.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate. Two replicas would each hold half the digest
    # buffer and flush two partial rollups an hour.
    type: Recreate
  selector:
    matchLabels:
      app: alert-router
  template:
    metadata:
      labels:
        app: alert-router
    spec:
      affinity:
        nodeAffinity:
          # Alertmanager is steered to thinkcentre02 by monitoring.yaml, and
          # every alert makes this hop. preferred, not required: if node02 is
          # down the alert path must still come up somewhere.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - thinkcentre02
      # Room for the SIGTERM handler to send the pending digest before the
      # kill. Recreate rollouts used to drop up to an hour of it.
      terminationGracePeriodSeconds: 15
      containers:
        - name: router
          # Tag plus index digest: the tag says which release, the digest makes
          # it immutable. Verify with cosign v3 (command in the repo README).
          image: ghcr.io/michaelrubi/alert-router:0.1.0@sha256:efd5e62bef04039d18b0e337d26da35a2f3e1eaf7d09b9e53d01cbf9b5161239
          env:
            - name: JEV_API_KEY
              valueFrom:
                secretKeyRef:
                  name: alert-router-secrets
                  key: JEV_API_KEY
            - name: NTFY_URL
              valueFrom:
                secretKeyRef:
                  name: alert-router-secrets
                  key: NTFY_URL
            - name: SUPPRESS_CONFIDENCE
              # Start deliberately high. Lower it once `kubectl logs` shows a
              # month of decisions and you can see where the model is actually
              # reliable, rather than guessing now.
              value: "0.90"
          ports:
            - containerPort: 8080
              name: http
          resources:
            # Cluster policy (manifests/kustomization.yaml): CPU request only,
            # memory request and limit.
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: alert-router
  namespace: monitoring
  labels:
    app: alert-router
spec:
  type: ClusterIP
  selector:
    app: alert-router
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alert-router
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: alert-router
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
