apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          ports:
            - containerPort: 3000
          # 2026-09-11: had no requests at all, so the scheduler counted
          # this pod as free. Measured ~119Mi steady-state.
          resources:
            requests:
              memory: "160Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
              cpu: "500m"
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "*"
            - name: HOMEPAGE_VAR_N8N_URL
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: N8N_URL
            - name: HOMEPAGE_VAR_VAULTWARDEN_URL
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secrets
                  key: VW_URL
            - name: HOMEPAGE_VAR_COUCHDB_URL
              valueFrom:
                secretKeyRef:
                  name: obsidian-secrets
                  key: COUCHDB_URL
            - name: HOMEPAGE_VAR_FORGEJO_URL
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: FORGEJO_URL
            - name: HOMEPAGE_VAR_JELLYFIN_KEY
              valueFrom:
                secretKeyRef:
                  name: jellyfin-secrets
                  key: JELLYFIN_KEY
            - name: HOMEPAGE_VAR_JELLYFIN_IP
              valueFrom:
                secretKeyRef:
                  name: jellyfin-secrets
                  key: JELLYFIN_IP
            - name: HOMEPAGE_VAR_HA_IP
              valueFrom:
                secretKeyRef:
                  name: homeassistant-secrets
                  key: HA_IP
            - name: HOMEPAGE_VAR_HA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homeassistant-secrets
                  key: HA_TOKEN
            - name: HOMEPAGE_VAR_POSTIZ_URL
              valueFrom:
                secretKeyRef:
                  name: postiz-secrets
                  key: MAIN_URL
            - name: HOMEPAGE_VAR_KANEO_URL
              valueFrom:
                secretKeyRef:
                  name: kaneo-secrets
                  key: KANEO_CLIENT_URL
            - name: HOMEPAGE_VAR_STALWART_URL
              valueFrom:
                secretKeyRef:
                  name: stalwart-secrets
                  key: PUBLIC_URL
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: logs
              mountPath: /app/config/logs
      volumes:
        - name: config
          configMap:
            name: homepage-config
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: homepage
  ports:
    - port: 8082
      targetPort: 3000
