apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      containers:
        - name: relay
          image: ghcr.io/rubiconetic/hermes-mobile/relay:latest
          ports:
            - containerPort: 8080
          env:
            - name: HERMES_URL
              value: "http://hermes-agent.default.svc.cluster.local:8642"
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: relay-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: relay
  ports:
    - port: 8080
      targetPort: 8080
