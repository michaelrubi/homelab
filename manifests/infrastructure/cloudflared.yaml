# Cloudflared Ingress ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-ingress
  namespace: default
data:
  config.yaml: |
    tunnel: 0
    credentials-file: /etc/cloudflared/creds/credentials.json
    protocol: http2
    ingress:
      - hostname: wallabag.robin-mine.ts.net
        service: http://wallabag-service.default.svc.cluster.local:8080
        originRequest:
          noTLSVerify: true
      - hostname: "*.robin-mine.ts.net"
        service: http://localhost:8080
        originRequest:
          noTLSVerify: true
      - service: http://localhost:8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          # --- HARDENING ---
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-secrets
                  key: TUNNEL_TOKEN
          volumeMounts:
            - name: cloudflared-config
              mountPath: /etc/cloudflared/config
              readOnly: true
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --config
            - /etc/cloudflared/config/config.yaml
      volumes:
        - name: cloudflared-config
          configMap:
            name: cloudflared-ingress
