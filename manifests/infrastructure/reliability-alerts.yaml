# Alerts for the failure modes that ran unnoticed from 2026-09-06 to
# 2026-09-11. kube-prometheus-stack's built-in rules already cover pod
# crash-looping and PVCs filling up; these cover the gaps it does not:
# a backup that silently stops running, a pod wedged Pending on a volume
# it can never mount, and a single node quietly absorbing the whole
# cluster until it starts swapping.
#
# None of these are useful without a real Alertmanager receiver. See the
# route config in monitoring.yaml -- it was previously "null", which is
# why the existing longhorn-alerts.yaml rules never reached anyone.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-reliability
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: backup.rules
      rules:
        - alert: BackupCronJobStale
          # postgres-dump-standalone runs daily at 04:00. 36h means we've
          # missed at least one full run plus a margin for a slow night.
          #
          # On 2026-09-11 this job had not succeeded in 5 days: every run
          # died on "access denied by server" mounting the NFS export from
          # thinkcentre02, 3908 failed mount attempts, zero notifications.
          expr: (time() - kube_cronjob_status_last_successful_time{cronjob=~".*(backup|dump).*"}) > 36 * 3600
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Backup {{ $labels.cronjob }} has not succeeded in over 36h"
            description: >-
              {{ $labels.namespace }}/{{ $labels.cronjob }} last completed
              {{ $value | humanizeDuration }} ago. Check for a Pending pod
              stuck on a volume mount:
              kubectl get pods -n {{ $labels.namespace }} | grep {{ $labels.cronjob }}

        - alert: BackupCronJobNeverSucceeded
          # The staleness rule above cannot fire if the series is absent,
          # which is the case for a job that has never once completed.
          expr: absent(kube_cronjob_status_last_successful_time{cronjob="postgres-dump-standalone"})
          for: 2h
          labels:
            severity: critical
          annotations:
            summary: "postgres-dump-standalone has no successful run on record"
            description: >-
              No completion has ever been recorded for the Postgres dump
              job. Either it has never worked, or kube-state-metrics is not
              reporting. Both are worth looking at immediately.

    - name: workload.rules
      rules:
        - alert: PodPendingTooLong
          # Catches the wedged-on-a-volume case directly. The Postgres dump
          # pod sat Pending for 5d12h retrying an NFS mount that was never
          # going to succeed, because the export on thinkcentre02 did not
          # permit it.
          #
          # Scoped to Job-owned pods, which is the exact gap in the default
          # ruleset. Upstream's KubePodNotReady already alerts on a pod
          # stuck Pending for 15m, but its expression carries
          # `kube_pod_owner{owner_kind!="Job"}` -- so a Deployment or
          # StatefulSet pod is covered and a CronJob pod, the case that
          # actually bit us, is not.
          #
          # 2026-09-12: without this `unless`, one broken pod arrived as
          # three separate notifications -- forgejo-runner-0 produced
          # KubePodNotReady, KubeContainerWaiting and PodPendingTooLong
          # for a single missing Secret. The complement below leaves
          # exactly one owner of each case.
          expr: |
            kube_pod_status_phase{phase="Pending"} == 1
            unless on (namespace, pod) kube_pod_owner{owner_kind!="Job"}
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} Pending for 30m+"
            description: >-
              Usually an unschedulable pod or a volume that will not mount.
              kubectl describe pod -n {{ $labels.namespace }} {{ $labels.pod }}

    - name: node-capacity.rules
      rules:
        - alert: NodeMemoryCritical
          # thinkcentre01 sat at 471Mi available of 7.6Gi with 2Gi of swap
          # consumed on 2026-09-11. At that point liveness probes across
          # the cluster time out and healthy pods get killed and restarted,
          # which looks like dozens of unrelated application failures.
          expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 12
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} has under 12% memory available"
            description: >-
              Only {{ $value | printf "%.1f" }}% available. Expect probe
              timeouts and a cluster-wide restart storm. Check whether
              workloads have drifted onto one node:
              kubectl get pods -A -o wide --field-selector spec.nodeName={{ $labels.instance }}

        - alert: NodeSwapThrashing
          # Was NodeSwapInUse, which alerted on resident swap above
          # 512Mi. That turned out to measure history, not health.
          #
          # 2026-09-12: thinkcentre01 held 1.4GiB in swap left over from
          # the Sep 6-11 memory crunch, so the rule fired on every
          # evaluation and kept firing -- the kernel never pages anything
          # back in unless something touches it, so resident swap only
          # falls on a reboot or a `swapoff`. Meanwhile the node was
          # healthy: 23% memory available, pswpout flat at 0 pages/s.
          # An alert that cannot clear once it fires is a permanent
          # notification, and a permanent notification is ignored.
          #
          # Paging *rate* is the honest signal. Swapping out at half a
          # megabyte a second, sustained for 15 minutes, means the node
          # is actively reclaiming to stay alive; that precedes probe
          # timeouts and it resolves on its own when the pressure lifts.
          expr: rate(node_vmstat_pswpout[15m]) * 4096 > 512 * 1024
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} is swapping out ({{ $value | humanize1024 }}B/s sustained)"
            description: >-
              The node is actively paging to disk, which means memory
              requests no longer reflect reality here. Compare requests
              against actual usage before it starts thrashing:
              kubectl top pods -A --sort-by=memory
