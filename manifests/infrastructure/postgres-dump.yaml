# Off-cluster pg_dumpall of the standalone postgres for belt-and-suspenders
# application-consistent backups. The Longhorn volume backup covers the data
# files too, but pg_dump gives us clean restore points and granular recovery.
#
# Runs daily at 04:00 (1 hour after Longhorn's 03:00 backup window) and prunes
# dumps older than 7 days. Output goes to the same NFS share on thinkcentre02
# at /var/lib/longhorn-backups/postgres-dumps/.
#
# 2026-10-24: the kaneo, postiz and postiz-temporal databases had only the
# Longhorn block backups. Each now gets its own job below, staggered 10
# minutes apart, with its own filename prefix -- each job prunes only its
# own prefix, so one job can never delete another's dumps. They use the
# postgres:17 client, which dumps both the 16 and 17 servers. The n8n job
# above is deliberately left exactly as it was. Every job matches the
# BackupCronJobStale rule in reliability-alerts.yaml by name.
#
# Forgejo's database is not here: it is a sidecar on 127.0.0.1 with no
# Service. See docs/runbooks/forgejo-postgres-upgrade.md.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-dumps-nfs
  labels:
    purpose: postgres-dumps
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    # Tailscale IP, deliberately not the hostname. "thinkcentre02" is
    # broken as an NFS server name from both nodes, for two different
    # reasons, which is why every run since 2026-09-06 failed:
    #   - from thinkcentre01 it does not resolve at all (NXDOMAIN); the
    #     mount hangs rather than failing fast.
    #   - from thinkcentre02 it resolves via that host's own /etc/hosts
    #     to 127.0.1.1, so the mount arrives over loopback and the server
    #     rejects it -- 127.0.0.1 is not in /etc/exports, which lists only
    #     the two Tailscale IPs and the pod CIDR. That is the "access
    #     denied by server" seen 3943 times.
    # The IP is reachable from both nodes (2049 and 111 open) and is
    # already permitted by the export, so it works wherever the job lands.
    server: 100.95.215.63
    path: /var/lib/longhorn-backups/postgres-dumps
  mountOptions:
    - hard
    - nfsvers=4
    - nolock
    - noatime
    - timeo=30
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-dumps
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: ""
  volumeName: postgres-dumps-nfs
  volumeMode: Filesystem
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-dump-standalone
  namespace: default
  labels:
    app: postgres-backup
spec:
  schedule: "0 4 * * *"
  timeZone: "America/Phoenix"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          # SETUP REQUIREMENT: the NFS directory on thinkcentre02 at
          # /var/lib/longhorn-backups/postgres-dumps must be owned by
          # 999:999. It was created root:root 0755, and because this job
          # runs as UID 999 every write failed with EACCES. fsGroup does
          # NOT solve this -- kubelet skips ownership changes on NFS
          # volumes, so the pod lands with gid=0 regardless of what is
          # set here. Fixed on 2026-09-12 with chown 999:999 + chmod 0775.
          #
          # This was the second of two stacked bugs that kept this job
          # from ever producing a dump: the PV pointed at an unresolvable
          # hostname, so pods never got past mounting and the permission
          # problem stayed hidden behind it for 81 days. If the directory
          # is ever recreated, BackupCronJobStale in reliability-alerts
          # fires within 36h rather than letting it rot silently again.
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            fsGroup: 999
          containers:
          - name: pg-dump
            image: postgres:16-alpine
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                DATE=$(date -u +%Y%m%d-%H%M%S)
                OUT=/dumps/postgres-standalone-${DATE}.sql.gz
                echo "Dumping standalone postgres to ${OUT}..."
                pg_dumpall -h postgres -U "${POSTGRES_USER}" | gzip > "${OUT}"
                echo "Dump size: $(ls -lh "${OUT}" | awk '{print $5}')"
                ls -la /dumps | tail -5
                # Prune dumps older than 7 days
                find /dumps -name "postgres-standalone-*.sql.gz" -mtime +7 -delete -print
                echo "Done."
            env:
              - name: POSTGRES_USER
                valueFrom:
                  secretKeyRef:
                    name: n8n-db-secrets
                    key: POSTGRES_USER
              - name: PGPASSWORD
                valueFrom:
                  secretKeyRef:
                    name: n8n-db-secrets
                    key: POSTGRES_PASSWORD
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
            volumeMounts:
              - name: dumps
                mountPath: /dumps
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: postgres-dumps
---
