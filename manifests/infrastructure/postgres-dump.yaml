# Off-cluster pg_dumpall of the standalone postgres for belt-and-suspenders
# application-consistent backups. The Longhorn volume backup covers the data
# files too, but pg_dump gives us clean restore points and granular recovery.
#
# Runs daily at 04:00 (1 hour after Longhorn's 03:00 backup window) and prunes
# dumps older than 7 days. Output goes to the same NFS share on thinkcentre02
# at /var/lib/longhorn-backups/postgres-dumps/.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-dumps-nfs
  labels:
    purpose: postgres-dumps
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: thinkcentre02
    path: /var/lib/longhorn-backups/postgres-dumps
  mountOptions:
    - hard
    - nfsvers=4
    - nolock
    - noatime
    - timeo=30
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-dumps
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: ""
  volumeName: postgres-dumps-nfs
  volumeMode: Filesystem
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-dump-standalone
  namespace: default
  labels:
    app: postgres-backup
spec:
  schedule: "0 4 * * *"
  timeZone: "America/Phoenix"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            fsGroup: 999
          containers:
          - name: pg-dump
            image: postgres:16-alpine
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                DATE=$(date -u +%Y%m%d-%H%M%S)
                OUT=/dumps/postgres-standalone-${DATE}.sql.gz
                echo "Dumping standalone postgres to ${OUT}..."
                pg_dumpall -h postgres -U "${POSTGRES_USER}" | gzip > "${OUT}"
                echo "Dump size: $(ls -lh "${OUT}" | awk '{print $5}')"
                ls -la /dumps | tail -5
                # Prune dumps older than 7 days
                find /dumps -name "postgres-standalone-*.sql.gz" -mtime +7 -delete -print
                echo "Done."
            env:
              - name: POSTGRES_USER
                valueFrom:
                  secretKeyRef:
                    name: n8n-db-secrets
                    key: POSTGRES_USER
              - name: PGPASSWORD
                valueFrom:
                  secretKeyRef:
                    name: n8n-db-secrets
                    key: POSTGRES_PASSWORD
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
            volumeMounts:
              - name: dumps
                mountPath: /dumps
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: postgres-dumps