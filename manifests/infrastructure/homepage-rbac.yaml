apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: default
---
# NOTE: this grant is currently unused. Homepage's Kubernetes widget is what
# needs it, and homepage-config.yaml sets `kubernetes.yaml: []`, i.e. the
# widget is off -- so the ServiceAccount holds cluster-wide read on pods,
# nodes, services and workloads that nothing exercises. Either enable the
# widget or drop this binding; leaving it is standing privilege for no feature.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage-cluster-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "configmaps", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage-cluster-role-binding
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage-cluster-role
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: default