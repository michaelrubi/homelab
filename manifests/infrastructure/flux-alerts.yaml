# Flux had no monitoring at all until 2026-09-20: no ServiceMonitor, no
# PodMonitor, no rule, no Alert. A wedged GitOps controller was invisible to
# every alert path in the cluster.
#
# That is a large blind spot, because a Kustomization that fails to build is
# all-or-nothing: it stops applying EVERY resource it owns, not just the one
# that is malformed. On 2026-09-20 a duplicated Secret document in
# secrets/secrets.sops.yaml failed `kustomize build` for ~35 minutes, and
# later an invalid PrometheusRule in THIS file failed admission for another
# ten. Both times everything under manifests/ was frozen behind it and
# lastAppliedRevision sat on a stale commit. Neither was reported.
#
# WHY THIS IS NOT A PrometheusRule
#
# The obvious implementation -- alert on gotk_reconcile_condition -- does not
# work on this cluster, and fails silently rather than loudly:
#
#   * gotk_reconcile_condition does not exist in Flux v1.8.x. The controllers
#     export only gotk_reconcile_duration_seconds plus event/token metrics.
#     A rule written against it is valid PromQL that never returns a sample.
#     This file shipped such a rule briefly (412fa77) before it was caught.
#
#   * controller_runtime_reconcile_errors_total{controller="kustomization"}
#     looks like a replacement and is not. Measured during the ten-minute
#     wedge above, it read exactly 0: Flux records a build failure in the
#     object's status and returns requeue_after, not a controller-runtime
#     error. result="requeue_after" was 2219, result="error" was 0.
#
# So no metric in this Flux version exposes Ready=False. The remaining
# options were teaching kube-state-metrics to export CR conditions -- which
# puts the source of KubePodNotReady and most default rules at risk if the
# config is wrong -- or using Flux's own event pipeline, below.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-system
  namespace: flux-system
  labels:
    # Required. The Prometheus instance selects monitors with
    # podMonitorSelector matchLabels release=kube-prometheus-stack; without
    # this label the object is created, never discovered, and anything built
    # on it evaluates against no data forever. podMonitorNamespaceSelector is
    # {} (all namespaces), which is why this can live outside `monitoring`.
    #
    # This is kept even though the alerting now goes through the Alert below:
    # reconcile durations and the controller-runtime metrics are worth having
    # for dashboards, and all four targets scrape clean.
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - helm-controller
          - kustomize-controller
          - notification-controller
          - source-controller
  podMetricsEndpoints:
    - port: http-prom
---
# Flux's own event pipeline, posted into the Alertmanager that is already
# running. notification-controller v1.8.4 supports a native `alertmanager`
# provider type, so the event arrives as a normal alert and passes through
# the same routes, inhibit rules and receivers as everything else.
#
# The payload carries Flux's actual error text rather than a generic
# summary -- "may not add resource with an already registered id: ..." is
# the whole diagnosis, in the notification.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: alertmanager
  namespace: flux-system
spec:
  type: alertmanager
  address: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093/api/v2/alerts
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: flux-reconciliation-errors
  namespace: flux-system
spec:
  providerRef:
    name: alertmanager
  # info would forward every successful reconcile. Only failures.
  eventSeverity: error
  # Listed as explicit (kind, namespace) pairs rather than a wildcard
  # namespace. The CRD documents `name: '*'` but says nothing about whether
  # `namespace` accepts one, and the failure mode for guessing wrong here is
  # an Alert that matches nothing and stays quiet -- which is exactly the
  # shape of bug this whole file exists to stop shipping.
  #
  # Cost of being explicit: a Flux object in a NEW namespace is not covered
  # until it is added here. Kustomizations and the GitRepository -- the ones
  # whose failure freezes everything -- are all in flux-system and are the
  # ones that matter most.
  eventSources:
    - kind: Kustomization
      name: '*'
      namespace: flux-system
    - kind: GitRepository
      name: '*'
      namespace: flux-system
    - kind: HelmRelease
      name: '*'
      namespace: default
    - kind: HelmRelease
      name: '*'
      namespace: monitoring
    - kind: HelmRepository
      name: '*'
      namespace: default
    - kind: HelmRepository
      name: '*'
      namespace: monitoring
