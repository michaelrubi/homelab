apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 2h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "66.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    # 0. Chart components that do not exist on K3s.
    #
    # 2026-09-12: KubeControllerManagerDown, KubeSchedulerDown and
    # KubeProxyDown fired as `critical` every hour, forever, and had done
    # since the stack was installed. None of them described a real fault.
    #
    # K3s does not run these as separate pods -- kube-controller-manager,
    # kube-scheduler and kube-proxy are goroutines inside the single `k3s
    # server` / `k3s agent` process, and this cluster's datastore is
    # SQLite, so there is no etcd either. The chart's ServiceMonitors
    # therefore selected nothing: Prometheus had zero active targets in
    # all four scrape pools. The alert expressions are
    # `absent(up{job="kube-scheduler"} == 1)`, so "no targets" is
    # indistinguishable from "the component is down" and they latch on
    # permanently.
    #
    # Turning the components off removes both halves of the problem --
    # the ServiceMonitor that can never resolve and the *Down rule that
    # reads its absence as an outage. Verified against the chart at
    # 66.7.1: each rules-1.14/kubernetes-system-*.yaml gates its whole
    # file on the matching `.Values.<component>.enabled`, so this toggle
    # drops the PrometheusRule too, not just the scrape config.
    #
    # The control plane is still monitored: it lives in the k3s process
    # on thinkcentre01, and the apiserver and kubelet targets (which do
    # work) cover it.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false

    # Individually disabled default rules.
    defaultRules:
      disabled:
        # Both of these ask "if I lost my largest node, would the
        # remaining nodes still fit every pod's requests?" That is a
        # sensible question on a 10-node cluster and a meaningless one
        # here: with 2 identical nodes, losing one halves the cluster,
        # so the check is `requests > one node's worth`. Measured
        # 2026-09-12: 4.86 CPU requested against 4.0 allocatable on a
        # single node, 10.96Gi memory against 7.65Gi. Both conditions
        # are permanently true and cannot be made false without either
        # a third node or cutting requests in half.
        #
        # Node-level pressure is still covered, by NodeMemoryCritical
        # and NodeSwapThrashing in reliability-alerts.yaml, which
        # measure what is actually happening rather than what would
        # happen in a hypothetical node loss.
        KubeCPUOvercommit: true
        KubeMemoryOvercommit: true

    # 1. Grafana Configuration
    grafana:
      # 2026-09-18: the chart ships no resource requests, so Grafana ran as
      # BestEffort -- first in line for the OOM killer under node pressure,
      # and invisible to the scheduler despite measuring 271Mi. Same failure
      # the reloader chart had (see reloader.yaml). Request reflects measured
      # use plus headroom; memory limit per the policy in kustomization.yaml.
      resources:
        requests:
          memory: "320Mi"
          cpu: "50m"
        limits:
          memory: "512Mi"

      # Prefer node02, soft. Grafana is human-facing and queried
      # intermittently, so the cross-node hop to Prometheus costs little, and
      # moving it keeps node01 from re-tilting now that its 320Mi is declared.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - thinkcentre02

      service:
        type: LoadBalancer
        port: 8084

      # Same RWO reasoning as the postgres Deployment: one replica on a
      # ReadWriteOnce Longhorn volume cannot roll without deadlocking on
      # Multi-Attach. The chart defaults to RollingUpdate.
      deploymentStrategy:
        type: Recreate

      # Persist Dashboards & Users using Longhorn
      persistence:
        enabled: true
        storageClassName: longhorn
        size: 2Gi

    # Chart components that also ship without resource requests. All three
    # measured 2026-09-18: kube-state-metrics 30Mi, operator 45Mi,
    # node-exporter 16-18Mi per node.
    kube-state-metrics:
      resources:
        requests:
          memory: "64Mi"
          cpu: "25m"
        limits:
          memory: "192Mi"

    prometheusOperator:
      resources:
        requests:
          memory: "64Mi"
          cpu: "25m"
        limits:
          memory: "192Mi"

    prometheus-node-exporter:
      resources:
        requests:
          memory: "32Mi"
          cpu: "10m"
        limits:
          memory: "96Mi"

    # 2. Prometheus Configuration
    prometheus:
      prometheusSpec:
        # Persist Metrics Data using Longhorn.
        #
        # 2026-09-11: this volume filled completely and Prometheus
        # crash-looped 1537 times with "no space left on device" on the WAL.
        # There was no retention cap at all, so the 10Gi volume grew until
        # the filesystem was full and monitoring went blind for 5 days.
        # Volume raised to 20Gi; retentionSize caps the TSDB well below it.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi

        # Hard ceiling on disk use. retentionSize is the safety net: time
        # retention alone cannot protect the volume, because how much disk
        # 15d costs depends on how many series are being scraped. Keep this
        # comfortably under the volume size to leave room for the WAL and
        # for compaction, which needs scratch space while it rewrites blocks.
        retention: 15d
        retentionSize: 12GiB

        # 2026-09-12: the 1000m CPU limit made recovery pathological. On
        # restart Prometheus must replay the WAL, and with 6188 segments
        # it sat pegged at the limit -- cgroup cpu.stat showed 703 of 1125
        # periods throttled and 167s spent waiting on the throttle against
        # only 81s of actual CPU. Replay was decelerating (3s -> 9s -> 24s
        # per segment) and would have taken hours, during which there is no
        # monitoring at all. A tight CPU limit on the component that has to
        # come back first after an incident is the wrong trade.
        #
        # Memory raised too: the in-memory head grows throughout replay,
        # and an OOM kill mid-replay means starting over from segment 0 --
        # a loop that never converges. Request reflects real steady-state
        # use rather than the old optimistic 512Mi.
        resources:
          requests:
            memory: 1Gi
            cpu: 250m
          limits:
            memory: 3Gi

    # 3. Alertmanager Configuration
    alertmanager:
      alertmanagerSpec:
        # Prefer node02. Soft, so a node02 outage does not leave alerting
        # Pending -- which would be the worst possible time to lose it.
        #
        # Placement had drifted almost entirely onto node01 (80% of its memory
        # requests vs 36% on identical hardware), and Kubernetes never moves a
        # running pod. Alertmanager has no persistence configured here, so
        # relocating it costs a restart and nothing else. Prometheus itself
        # stays on node01: it has a 20Gi Longhorn volume and is the component
        # that most needs to come back fast after an incident.
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - thinkcentre02
      config:
        global:
          resolve_timeout: 5m

        route:
          # Default destination for everything that is not Watchdog.
          #
          # 2026-09-11: this was previously receiver "null" -- the chart
          # default -- so every alert in the cluster was discarded. Four
          # separate failures (Prometheus disk full, NFS backup mounts
          # denied, forgejo runner deregistered, postiz probe misconfigured)
          # ran unnoticed for 5+ days, and the hand-written Longhorn alerts
          # in longhorn-alerts.yaml fired into the void.
          # 2026-09-20: was `ntfy`. The warning tier now passes through
          # alert-router (infrastructure/alert-router.yaml), which classifies
          # each group as page / digest / suppress and forwards to this same
          # ntfy topic. It fails open -- any error, timeout or low-confidence
          # verdict pages exactly as before -- so the worst case is today's
          # volume, not September 6th's silence.
          #
          # ROLLBACK is this one word: set it back to `ntfy` and the router is
          # out of the path entirely. The receiver below is kept for that.
          receiver: alert-router
          group_by: [alertname, namespace]
          group_wait: 30s
          group_interval: 5m
          # Re-notify every 4h rather than every 12h. A homelab outage that
          # resolves itself between two 12h reminders leaves no trace.
          repeat_interval: 4h

          routes:
            # Watchdog is a synthetic alert that kube-prometheus-stack fires
            # CONTINUOUSLY, by design, for exactly this purpose. Sending it
            # to a dead-man's-switch means the absence of alerts is itself
            # monitored: if Prometheus dies, the node dies, or the cluster
            # dies, the pings stop and healthchecks.io notifies out-of-band.
            #
            # This is the layer that would have caught the Sep 6 outage on
            # day one. A normal alert path could not -- Prometheus was the
            # thing that was down, so it could not alert on its own death.
            - receiver: deadmansswitch
              matchers:
                - alertname = "Watchdog"
              group_wait: 0s
              group_interval: 5m
              repeat_interval: 5m

            # Critical alerts re-notify aggressively, and are the only
            # ones worth a "this cleared" message. See ntfy-critical.
            - receiver: ntfy-critical
              matchers:
                - severity = "critical"
              continue: false
              repeat_interval: 1h

        receivers:
          # NOTE: the ntfy URL below is a capability -- anyone who knows
          # the topic can read these alerts and publish to it. The topic is
          # random for that reason. ntfy.sh free tier cannot reserve topics
          # or require auth; if you want that, self-host ntfy or move this
          # block to a sops-encrypted alertmanager configSecret.

          # The router. Alertmanager retries a non-2xx, so the service
          # acknowledges immediately and classifies after responding.
          - name: alert-router
            webhook_configs:
              - url: http://alert-router.monitoring.svc.cluster.local:8080/
                send_resolved: false
                max_alerts: 0

          # Kept, though the default route no longer points here, so rolling
          # back is a one-word edit above rather than restoring a deleted block.
          - name: ntfy
            webhook_configs:
              # 2026-09-12: send_resolved was true on every path, so each
              # warning cost two notifications -- one to say a disk was
              # filling, one to say it wasn't any more. For a warning the
              # second message carries almost nothing: nobody acted on the
              # first, and the condition cleared on its own. Dropping it
              # halves the volume on the noisiest route.
              - url: https://ntfy.sh/homelab-alerts-b5b04a9b1190a542
                send_resolved: false
                max_alerts: 0

          - name: ntfy-critical
            webhook_configs:
              # Critical keeps send_resolved. Here the second message is
              # the point: if something woke you at 03:00, you want to know
              # it recovered without having to open Grafana to find out.
              - url: https://ntfy.sh/homelab-alerts-b5b04a9b1190a542
                send_resolved: true
                max_alerts: 0

          - name: deadmansswitch
            webhook_configs:
              # healthchecks.io check configured with period 5m / grace
              # 15m, matching the repeat_interval on the Watchdog route
              # above: a ping every 5 minutes, and it alerts after roughly
              # three are missed. Like the ntfy topic, this URL is a
              # capability -- anyone holding it can ping the check and keep
              # it looking alive, so treat it as a secret.
              - url: https://hc-ping.com/bc2e331a-8720-4797-b3bb-048da093ff8b
                send_resolved: false

        inhibit_rules:
          # Suppress warning/info for a resource already firing critical,
          # so one real failure does not arrive as three notifications.
          - source_matchers: [severity = "critical"]
            target_matchers: [severity =~ "warning|info"]
            equal: [namespace, alertname]
          - source_matchers: [severity = "warning"]
            target_matchers: [severity = "info"]
            equal: [namespace, alertname]

          # One broken pod is one incident, not four notifications.
          #
          # 2026-09-20, the CouchDB outage: a single pod stuck in
          # CreateContainerConfigError produced KubePodNotReady,
          # KubeDeploymentReplicasMismatch, KubePodCrashLooping and
          # KubeDeploymentRolloutStuck within ten minutes. The router
          # classified all four page_now -- correctly, each is a true
          # statement -- and all four were delivered. Four pages describing
          # one fact is how a notification channel stops being read, and it
          # was: the outage was found by opening Obsidian, not by alert.
          #
          # The two severity rules above cannot collapse these, because
          # `equal` includes alertname -- so a critical only ever inhibits a
          # warning of the SAME name, which no pair of rules here produces.
          # Deduplicating across alertnames needs its own rule.
          #
          # Deliberate tradeoff: `equal` is namespace only. The pod alerts
          # carry `pod`, the deployment alerts carry `deployment`, and
          # Alertmanager can only join on labels that are equal, not on one
          # that is a prefix of the other. So while any pod in a namespace is
          # unhealthy, deployment-level alerts for that namespace are held
          # back -- and nearly everything here lives in `default`. That is
          # real isolation traded for quiet. The alert that survives names
          # the failing pod, and `kubectl get pods -n <ns>` shows the rest.
          - source_matchers:
              - alertname =~ "KubePodNotReady|KubePodCrashLooping"
            target_matchers:
              - alertname =~ "KubeDeploymentReplicasMismatch|KubeDeploymentRolloutStuck|KubeStatefulSetReplicasMismatch|KubeStatefulSetUpdateNotRolledOut|KubeDaemonSetRolloutStuck"
            equal: [namespace]

          # A crash-looping pod is by definition also not ready. Keep the
          # alert that names the container and the restart count.
          - source_matchers:
              - alertname = "KubePodCrashLooping"
            target_matchers:
              - alertname = "KubePodNotReady"
            equal: [namespace, pod]

          # 2026-09-12: the two rules below are chart defaults that this
          # hand-written inhibit_rules block silently replaced. Dropping
          # them broke InfoInhibitor in both directions.
          #
          # InfoInhibitor is a synthetic alert -- `ALERTS{severity="info"}
          # unless on(namespace) ALERTS{severity=~"warning|critical"}` --
          # that exists purely to be a source for the first rule. It is
          # never meant to reach a receiver. But it carries severity
          # "none", so it matched neither the Watchdog route nor the
          # critical route and fell through to ntfy, arriving on the phone
          # as an alert named "InfoInhibitor" with no description. It also
          # flaps by construction, appearing and clearing with every
          # transient info alert.
          #
          # First rule: let InfoInhibitor do its job, suppressing info
          # alerts in a namespace that has nothing worse going on.
          # Second rule: no source_matchers means every alert is a source,
          # and Watchdog always fires -- so InfoInhibitor is permanently
          # inhibited and can never notify. That is the intent upstream.
          - source_matchers: [alertname = "InfoInhibitor"]
            target_matchers: [severity = "info"]
            equal: [namespace]
          - target_matchers: [alertname = "InfoInhibitor"]
