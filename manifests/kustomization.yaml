# Cluster-wide resource policy (2026-09-18)
#
# CPU: requests only, no limits. CPU is compressible -- when a node is
# contended the kernel already shares it by request weight, so a limit adds
# nothing but hard CFS throttling, and it throttles even when the node is
# idle. The Prometheus note in infrastructure/monitoring.yaml worked this out
# the expensive way: WAL replay pegged at its 1000m limit, 703 of 1125 periods
# throttled, recovery decelerating toward hours. That reasoning was right and
# applied to every workload here, not just Prometheus. Before this change CPU
# limits summed to 577% of one node's capacity while the node ran at 29% CPU.
#
# Memory: requests AND limits. Memory is incompressible -- a limit is the only
# thing standing between one leaking process and an OOM-killed node.
#
# So: adding a workload, set requests for both, and a memory limit. Do not add
# a CPU limit.

# Volume ownership: fsGroupChangePolicy: OnRootMismatch
#
# Any pod with fsGroup and a volume gets one. The default, Always, makes
# kubelet walk the entire volume and chown every file on every single pod
# start -- time proportional to file count, not data size, so a Forgejo repo
# volume full of small git objects is the worst case.
#
# Observed 2026-09-18 during a full rollout: Forgejo sat in Init for minutes
# and kubelet emitted VolumePermissionChangeInProgress, recommending exactly
# this setting. It is paid on every rollout and on every kured reboot, which
# is weekly.
#
# OnRootMismatch chowns only when the volume ROOT's ownership is already
# wrong, i.e. the first attach. The tradeoff: if files below the root have
# wrong ownership but the root is correct, it will not repair them. That is
# fine here -- these volumes are already correctly owned, and the workloads
# that were fussy about it (forgejo, n8n, the runner) also run an explicit
# chown init container. If you ever restore a volume from a backup with
# foreign ownership, set this back to Always for one boot.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- automation/n8n-pg.yaml
- automation/n8n-service.yaml
- automation/n8n.yaml
- communication/stalwart.yaml
- infrastructure/alert-router.yaml
- infrastructure/alert-router-alerts.yaml
- infrastructure/cloudflared.yaml
- infrastructure/flux-alerts.yaml
- infrastructure/homepage-app.yaml
- infrastructure/homepage-config.yaml
- infrastructure/homepage-rbac.yaml
- infrastructure/kured.yaml
- infrastructure/longhorn-alerts.yaml
- infrastructure/longhorn-backup-target.yaml
- infrastructure/longhorn-recurring-job.yaml
- infrastructure/longhorn-monitor.yaml
- infrastructure/longhorn.yaml
- infrastructure/monitoring.yaml
- infrastructure/network-policies.yaml
- infrastructure/offsite-backup.yaml
- infrastructure/pgweb.yaml
- infrastructure/postgres-dump.yaml
- infrastructure/reliability-alerts.yaml
- infrastructure/reloader.yaml
- infrastructure/renovate.yaml
- infrastructure/vaultwarden.yaml
- media/jackett.yaml
- media/torrenter.yaml
- productivity/forgejo.yaml
- productivity/kaneo-postgres.yaml
- productivity/kaneo.yaml
- secrets/secrets.sops.yaml
- secrets/alertmanager-webhooks.sops.yaml
- productivity/obsidian-sync.yaml
- social/postiz-app.yaml
- social/postiz-instagram-provider-js-configmap.yaml
- social/postiz-postgres.yaml
- social/postiz-redis.yaml
- social/postiz-temporal.yaml

# ---------------------------------------------------------------------------
# Placement: which workloads prefer thinkcentre02
#
# Two identical 8GB nodes, but placement had drifted almost entirely onto
# node01 and would not self-correct: Kubernetes never relocates a running pod,
# and ImageLocality scoring keeps pulling reschedules back to node01, which has
# had every image cached since the cluster was built.
#
# 2026-09-18: steering four workloads was not enough. A full rollout (the
# fsGroupChangePolicy change) restarted everything at once, and every pod
# WITHOUT an explicit preference landed on node01 -- including postiz at
# 2080Mi, which alone is 27% of a node. Result was 97% / 26%, worse than
# before. With two nodes and one dominant workload, the balance hinges on that
# workload, so it has to be declared rather than left to the scheduler mid-
# rollout when "emptiest node" is whatever happens to be draining.
#
# Grouping is by application, not just by size, so each app sits with its own
# database and the split does not add cross-node hops:
#   node02  postiz + its whole stack (postgres, redis, temporal, temporal-
#           postgres, elasticsearch), kaneo + kaneo-postgres, couchdb,
#           homepage, torrenter  ... plus grafana and alertmanager, which are
#           set in monitoring.yaml because they come from the Helm chart.
#   node01  prometheus (20Gi volume, must recover fastest after an incident),
#           forgejo + runner (nodeSelector-pinned, Flux's own git source),
#           n8n + its postgres, stalwart, jackett, vaultwarden, flux itself.
# Projected: roughly 61% / 62%.
#
# preferred, not required: if node02 is down these still schedule on node01
# rather than going Pending.
patches:
  - target:
      kind: Deployment
      name: ^(postiz|postiz-postgres|postiz-redis|postiz-temporal|postiz-temporal-postgres|postiz-temporal-elasticsearch|kaneo|kaneo-postgres|couchdb|homepage|torrenter)$
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - thinkcentre02
  - target:
      kind: Deployment
      name: ^(stalwart|jackett-deployment|vaultwarden|postgres|n8n-deployment)$
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - thinkcentre01
