# ClusterIP Service for n8n, used by the Cloudflare Tunnel ingress
# (cloudflared routes traffic to n8n-service.default.svc.cluster.local:5678).
# Without this Service, CF tunnel DNS lookups fail and the UI is unreachable.
apiVersion: v1
kind: Service
metadata:
  name: n8n-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: n8n
  ports:
    - port: 5678
      targetPort: 5678
      protocol: TCP
      name: http