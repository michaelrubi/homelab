# 1. PVC for Persistence (Config & Workspace)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: moltbot-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# 2. Moltbot Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moltbot
  namespace: default
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: moltbot
  template:
    metadata:
      labels:
        app: moltbot
    spec:
      # Moltbot runs as node (1000:1000) by default
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: moltbot
          image: moltbot:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/index.js", "gateway"]
          ports:
            - containerPort: 18789
              name: http
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          env:
            - name: NODE_ENV
              value: "production"
            - name: AGENTS_DEFAULTS_SANDBOX_MODE
              value: "off"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "18789"
            - name: CLAWDBOT_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: moltbot-secrets
                  key: GATEWAY_TOKEN
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moltbot-secrets
                  key: ANTHROPIC_API_KEY
          volumeMounts:
            - name: moltbot-data
              mountPath: /home/node/.clawdbot
              subPath: config
            - name: moltbot-data
              mountPath: /home/node/clawd
              subPath: workspace
      volumes:
        - name: moltbot-data
          persistentVolumeClaim:
            claimName: moltbot-pvc
---
# 3. Service
apiVersion: v1
kind: Service
metadata:
  name: moltbot-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: moltbot
  ports:
    - port: 18789
      targetPort: 18789
      name: http
