# 1. The Storage Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# 1b. The Postgres 17 volume. Restored from a pg_dumpall of the 16 cluster
# by docs/runbooks/n8n-3-followups.md, part B. postgres-pvc above is kept,
# unused, as the rollback until it's removed in a later PR.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc-17
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# 2. The Database Service
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: default
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# 3. The Database Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: default
spec:
  replicas: 1
  # A single-replica Deployment on a ReadWriteOnce volume MUST use
  # Recreate. With the default RollingUpdate, Kubernetes starts the new
  # pod before terminating the old one, the new pod cannot attach a
  # volume the old one still holds, and the rollout deadlocks on
  # "Multi-Attach error" -- which is exactly what happened on
  # 2026-09-12 when adding resource requests triggered a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 999
        # See the fsGroup note in manifests/kustomization.yaml.
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: postgres
        # Deliberately postgres:16, NOT postgres:16-alpine, even though every
        # other Postgres here is alpine. The data directory was initialised by
        # a glibc build; alpine is musl, and the two disagree on text
        # collation. Same major means the files mount fine, so this fails
        # silently -- existing btree indexes on text columns stay ordered by
        # glibc rules while the server compares by musl rules, and queries
        # start missing rows with no error anywhere.
        #
        # Switching is a dump/restore (or a REINDEX of every text index), not
        # a tag edit. The ~150MB of extra image size is the cheaper option.
        #
        # 2026-11: upgraded 16 -> 17 (n8n 3.x supports 17+ only) by dump and
        # restore into postgres-pvc-17, still on the glibc image.
        # docs/runbooks/n8n-3-followups.md part B is the procedure.
        image: postgres:17
        ports:
        - containerPort: 5432
        # 2026-09-11: no requests were set, so the scheduler treated this
        # database as weightless when placing pods.
        resources:
          requests:
            memory: "192Mi"
            cpu: "50m"
          limits:
            memory: "1Gi"
        envFrom:
        - secretRef:
            name: n8n-db-secrets
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
          subPath: data
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc-17
