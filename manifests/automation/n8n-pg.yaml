# 1. The Storage Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# 2. The Database Service
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: default
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# 3. The Database Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: default
spec:
  replicas: 1
  # A single-replica Deployment on a ReadWriteOnce volume MUST use
  # Recreate. With the default RollingUpdate, Kubernetes starts the new
  # pod before terminating the old one, the new pod cannot attach a
  # volume the old one still holds, and the rollout deadlocks on
  # "Multi-Attach error" -- which is exactly what happened on
  # 2026-09-12 when adding resource requests triggered a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
      - name: postgres
        image: postgres:16
        ports:
        - containerPort: 5432
        # 2026-09-11: no requests were set, so the scheduler treated this
        # database as weightless when placing pods.
        resources:
          requests:
            memory: "192Mi"
            cpu: "50m"
          limits:
            memory: "1Gi"
        envFrom:
        - secretRef:
            name: n8n-db-secrets
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
          subPath: data
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
