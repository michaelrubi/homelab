# 1. PVC for Config & Keys (Critical for Encryption)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# 2. The n8n Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-deployment
  namespace: default
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      # Permissions fix for Longhorn volumes
      securityContext:
        fsGroup: 1000
        # See the fsGroup note in manifests/kustomization.yaml.
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 1000
        runAsGroup: 1000

      # --- Durable custom-node installer ---
      # Installs community nodes onto the PVC so they survive pod restarts.
      # --ignore-scripts/--no-optional skip native builds (e.g. isolated-vm)
      # that fail in this minimal image.
      #
      # 2026-09-18: every version is exact. Six were "*" and five were carets,
      # so each restart resolved whatever npm served at that moment and pulled
      # it straight into a production automation engine -- a supply-chain path
      # where any future release, compromised or merely broken, lands without
      # review. Versions below are the ones that were actually installed when
      # they were pinned. Bump them deliberately.
      #
      # The install is also skipped when the PVC already holds exactly this
      # package set, so a restart no longer waits on the network. Editing the
      # dependency list changes the stamp and forces a reinstall.
      initContainers:
      - name: init-n8n-nodes
        image: node:20-alpine
        command:
        - sh
        - -c
        - |
          set -eu
          mkdir -p /home/node/.n8n/nodes
          cd /home/node/.n8n/nodes
          cat > package.json <<'PKGJSON'
          {
            "name": "n8n-custom-nodes",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "n8n-nodes-minimax-chat": "0.1.10",
              "@kenkaiii/n8n-nodes-supercode": "1.6.2",
              "n8n-nodes-forgejo": "0.2.0",
              "@mendable/n8n-nodes-firecrawl": "2.2.0",
              "n8n-nodes-webcrawlerapi": "0.3.7",
              "n8n-nodes-scoro": "^1.1.0",
              "n8n-nodes-run-node-with-credentials-x": "0.4.1",
              "@gotohuman/n8n-nodes-gotohuman": "0.3.0",
              "n8n-nodes-instantly": "0.1.7547",
              "n8n-nodes-tesseractjs": "1.5.1",
              "n8n-nodes-postiz": "0.2.17",
              "n8n-nodes-anydoc": "0.1.0"
            }
          }
          PKGJSON
          # Skip the reinstall when the PVC already matches this package set.
          STAMP=/home/node/.n8n/nodes/.pkg-stamp
          WANT=$(sha256sum package.json | cut -d' ' -f1)
          if [ -f "$STAMP" ] && [ "$(cat "$STAMP")" = "$WANT" ] && [ -d node_modules ]; then
            echo "Custom nodes already installed for this package set; skipping npm install."
          else
            echo 'Installing custom nodes...'
            npm install --omit=dev --omit=optional --ignore-scripts --no-audit --no-fund || { echo 'npm install FAILED'; exit 1; }
            printf '%s' "$WANT" > "$STAMP"
            INSTALLED=1
          fi
          echo 'Verifying packages...'
          for pkg in n8n-nodes-minimax-chat @kenkaiii/n8n-nodes-supercode n8n-nodes-forgejo @mendable/n8n-nodes-firecrawl n8n-nodes-webcrawlerapi n8n-nodes-scoro n8n-nodes-anydoc; do
            if [ ! -d "node_modules/$pkg" ]; then
              echo "ERROR: $pkg not found after install!"
              exit 1
            fi
            echo "  OK: $pkg"
          done
          echo 'All custom nodes installed successfully.'
          # npm runs as root, so a fresh install leaves root-owned files that
          # need handing back to uid 1000. Otherwise skip the chown -R: walking
          # every node_modules file on each restart was pure overhead.
          if [ "${INSTALLED:-0}" = 1 ] || [ "$(stat -c '%u:%g' /home/node/.n8n)" != "1000:1000" ]; then
            chown -R 1000:1000 /home/node/.n8n || true
          fi
        volumeMounts:
        - name: n8n-data
          mountPath: /home/node/.n8n
        securityContext:
          runAsUser: 0
          runAsGroup: 0

      containers:
      - name: n8n
        image: docker.n8n.io/n8nio/n8n:2.46.3
        ports:
        - containerPort: 5678
        resources:
          requests:
            # Measured at ~613Mi on 2026-09-11 against a 256Mi request.
            # Under-requesting hides real load from the scheduler.
            memory: "640Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 5
        volumeMounts:
        - name: n8n-data
          mountPath: /home/node/.n8n
        env:
        - name: GENERIC_TIMEZONE
          value: "America/Phoenix"
        - name: TZ
          value: "America/Phoenix"
        - name: N8N_SECURE_COOKIE
          value: "false"
        - name: N8N_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: N8N_ENCRYPTION_KEY
        - name: WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: N8N_URL
        - name: N8N_EDITOR_BASE_URL
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: N8N_URL
        - name: DB_TYPE
          value: postgresdb
        - name: DB_POSTGRESDB_HOST
          value: postgres
        - name: DB_POSTGRESDB_PORT
          value: "5432"
        - name: DB_POSTGRESDB_USER
          valueFrom:
            secretKeyRef:
              name: n8n-db-secrets
              key: POSTGRES_USER
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-db-secrets
              key: POSTGRES_PASSWORD
        - name: DB_POSTGRESDB_DATABASE
          valueFrom:
            secretKeyRef:
              name: n8n-db-secrets
              key: POSTGRES_DB
      volumes:
      - name: n8n-data
        persistentVolumeClaim:
          claimName: n8n-pvc