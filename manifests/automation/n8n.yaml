# 1. PVC for Config & Keys (Critical for Encryption)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# 2. The n8n Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-deployment
  namespace: default
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      # Permissions fix for Longhorn volumes
      securityContext:
        fsGroup: 1000
        # See the fsGroup note in manifests/kustomization.yaml.
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 1000
        runAsGroup: 1000

      # --- Community nodes ---
      # Installed and updated from the n8n UI (Settings > Community nodes).
      # n8n records each package and its exact version in Postgres and keeps
      # the files on the PVC under ~/.n8n/nodes. N8N_REINSTALL_MISSING_PACKAGES
      # reinstalls anything recorded but missing on disk at startup, at the
      # recorded version, so an n8n upgrade or a lost PVC heals itself.
      #
      # This replaces an init container that rewrote ~/.n8n/nodes/package.json
      # from a list in this file. Its npm install pruned every UI-installed
      # package while n8n's database still listed them, which showed up as
      # load errors on the Community nodes page. Don't reintroduce it: there
      # must be one owner of that directory, and it is n8n.

      containers:
      - name: n8n
        image: docker.n8n.io/n8nio/n8n:2.47.3
        ports:
        - containerPort: 5678
        resources:
          requests:
            # Measured at ~613Mi on 2026-09-11 against a 256Mi request.
            # Under-requesting hides real load from the scheduler.
            memory: "640Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 5
        volumeMounts:
        - name: n8n-data
          mountPath: /home/node/.n8n
        env:
        - name: GENERIC_TIMEZONE
          value: "America/Phoenix"
        - name: TZ
          value: "America/Phoenix"
        - name: N8N_SECURE_COOKIE
          value: "false"
        - name: N8N_REINSTALL_MISSING_PACKAGES
          value: "true"
        # n8n 3.0 flips this default to false, and installed unverified
        # community nodes then stop loading. Set explicitly so the 2.x
        # behaviour carries over the upgrade. Already true on 2.x.
        - name: N8N_UNVERIFIED_PACKAGES_ENABLED
          value: "true"
        # Code node timeout in seconds. n8n 3.0 drops the default from 300
        # to 60. Keep 300 until the slow workflows are known, then lower it.
        - name: N8N_RUNNERS_TASK_TIMEOUT
          value: "300"
        - name: N8N_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: N8N_ENCRYPTION_KEY
        - name: WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: N8N_URL
        - name: N8N_EDITOR_BASE_URL
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: N8N_URL
        - name: DB_TYPE
          value: postgresdb
        - name: DB_POSTGRESDB_HOST
          value: postgres
        - name: DB_POSTGRESDB_PORT
          value: "5432"
        - name: DB_POSTGRESDB_USER
          valueFrom:
            secretKeyRef:
              name: n8n-db-secrets
              key: POSTGRES_USER
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-db-secrets
              key: POSTGRES_PASSWORD
        - name: DB_POSTGRESDB_DATABASE
          valueFrom:
            secretKeyRef:
              name: n8n-db-secrets
              key: POSTGRES_DB
      volumes:
      - name: n8n-data
        persistentVolumeClaim:
          claimName: n8n-pvc