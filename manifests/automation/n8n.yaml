# 1. PVC for Config & Keys (Critical for Encryption)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# 2. The n8n Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-deployment
  namespace: default
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      # Permissions fix for Longhorn volumes
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000

      # --- Durable custom-node installer ---
      # Replaces the previous busybox no-op. Runs `npm install` against a
      # hardcoded list of community node packages so they survive PVC wipes
      # and pod restarts. Uses --ignore-scripts/--no-optional to skip native
      # builds (e.g. isolated-vm) that fail in this minimal image.
      initContainers:
      - name: init-n8n-nodes
        image: node:20-alpine
        command:
        - sh
        - -c
        - |
          set -eu
          mkdir -p /home/node/.n8n/nodes
          cd /home/node/.n8n/nodes
          cat > package.json <<'PKGJSON'
          {
            "name": "n8n-custom-nodes",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "n8n-nodes-minimax-chat": "*",
              "@kenkaiii/n8n-nodes-supercode": "*",
              "n8n-nodes-forgejo": "*",
              "@mendable/n8n-nodes-firecrawl": "*",
              "n8n-nodes-webcrawlerapi": "*",
              "n8n-nodes-scoro": "*",
              "n8n-nodes-run-node-with-credentials-x": "^0.4.1",
              "@gotohuman/n8n-nodes-gotohuman": "^0.3.0",
              "n8n-nodes-instantly": "^0.1.7547",
              "n8n-nodes-tesseractjs": "^1.5.1",
              "n8n-nodes-postiz": "^0.2.17"
            }
          }
          PKGJSON
          echo 'Installing custom nodes...'
          npm install --omit=dev --omit=optional --ignore-scripts --no-audit --no-fund || { echo 'npm install FAILED'; exit 1; }
          echo 'Verifying packages...'
          for pkg in n8n-nodes-minimax-chat @kenkaiii/n8n-nodes-supercode n8n-nodes-forgejo @mendable/n8n-nodes-firecrawl n8n-nodes-webcrawlerapi n8n-nodes-scoro; do
            if [ ! -d "node_modules/$pkg" ]; then
              echo "ERROR: $pkg not found after install!"
              exit 1
            fi
            echo "  OK: $pkg"
          done
          echo 'All custom nodes installed successfully.'
          chown -R 1000:1000 /home/node/.n8n || true
        volumeMounts:
        - name: n8n-data
          mountPath: /home/node/.n8n
        securityContext:
          runAsUser: 0
          runAsGroup: 0

      containers:
      - name: n8n
        image: docker.n8n.io/n8nio/n8n:2.30.4
        ports:
        - containerPort: 5678
        resources:
          requests:
            # Measured at ~613Mi on 2026-09-11 against a 256Mi request.
            # Under-requesting hides real load from the scheduler.
            memory: "640Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 5
        volumeMounts:
        - name: n8n-data
          mountPath: /home/node/.n8n
        env:
        - name: GENERIC_TIMEZONE
          value: "America/Phoenix"
        - name: TZ
          value: "America/Phoenix"
        - name: N8N_SECURE_COOKIE
          value: "false"
        - name: N8N_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: N8N_ENCRYPTION_KEY
        - name: WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: N8N_URL
        - name: N8N_EDITOR_BASE_URL
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: N8N_URL
        - name: DB_TYPE
          value: postgresdb
        - name: DB_POSTGRESDB_HOST
          value: postgres
        - name: DB_POSTGRESDB_PORT
          value: "5432"
        - name: DB_POSTGRESDB_USER
          valueFrom:
            secretKeyRef:
              name: n8n-db-secrets
              key: POSTGRES_USER
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-db-secrets
              key: POSTGRES_PASSWORD
        - name: DB_POSTGRESDB_DATABASE
          valueFrom:
            secretKeyRef:
              name: n8n-db-secrets
              key: POSTGRES_DB
      volumes:
      - name: n8n-data
        persistentVolumeClaim:
          claimName: n8n-pvc