# 1. PVC for Forgejo DB
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-db-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# 2. PVC for Forgejo Data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
# 3. Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: default
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        # --- Postgres ---
        - name: postgres
          image: postgres:14-alpine
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: forgejo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: FORGEJO_DB_PASSWORD
            - name: POSTGRES_DB
              value: forgejo
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
        # --- Forgejo ---
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:14
          env:
            - name: FORGEJO__database__DB_TYPE
              value: postgres
            - name: FORGEJO__database__HOST
              value: "127.0.0.1:5432"
            - name: FORGEJO__database__NAME
              value: forgejo
            - name: FORGEJO__database__USER
              value: forgejo
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: FORGEJO_DB_PASSWORD
            - name: FORGEJO__server__ROOT_URL
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: FORGEJO_URL
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true" # Assume configured after first run or we rely on auto-setup
            # Admin setup can be done via CLI or initial web UI.
            # We skip auto-admin creation to avoid complex secret handling unless requested.
          volumeMounts:
            - name: data
              mountPath: /data
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 22
              name: ssh
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: forgejo-db-pvc
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data-pvc
---
# 4. Service
apiVersion: v1
kind: Service
metadata:
  name: forgejo-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: forgejo
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
    - name: ssh
      port: 2222
      targetPort: 22
      protocol: TCP
---
# 5. Runner Config
apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-config
  namespace: default
data:
  config.yml: |
    log:
      level: info
    runner:
      file: /data/runner
      capacity: 1
      timeout: 3h
      envs:
        GITHUB_SERVER_URL: "http://forgejo-service.default.svc.cluster.local:3000"
    cache:
      enabled: true
      dir: /data/cache
    container:
      docker_host: tcp://localhost:2375
---
# 6. Runner
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forgejo-runner
  namespace: default
spec:
  serviceName: "forgejo-runner" # Required for StatefulSet networking
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-runner
  # This automatically creates a PVC for each replica (e.g. runner-data-forgejo-runner-0)
  volumeClaimTemplates:
    - metadata:
        name: runner-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "longhorn"
        resources:
          requests:
            storage: 2Gi
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      nodeName: thinkcentre01
      volumes:
        - name: config
          configMap:
            name: runner-config
      initContainers:
        - name: volume-permissions
          image: busybox:latest
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          volumeMounts:
            - name: runner-data
              mountPath: /data
      containers:
        # 1. The Runner Daemon
        - name: runner
          image: data.forgejo.org/forgejo/runner:11
          command:
            - "/bin/sh"
            - "-c"
            - |
              # 1. Wait for Docker (Fixes the crash loop)
              echo "Waiting for Docker daemon..."
              while ! nc -z localhost 2375; do sleep 1; done
              echo "Docker is ready!"

              # 2. Smart Registration (Prevents zombie runners)
              # The config says the file is at /data/runner
              if [ ! -f "/data/runner" ]; then
                echo "Registration file not found. Registering new runner..."
                forgejo-runner register --no-interactive --config /config/config.yml --name $FORGEJO_RUNNER_NAME --instance $FORGEJO_INSTANCE_URL --token $FORGEJO_RUNNER_REGISTRATION_TOKEN --labels docker:docker://node:22-alpine,ubuntu-latest:docker://node:22-alpine,kaniko:docker://gcr.io/kaniko-project/executor:debug
              else
                echo "Runner already registered. Skipping registration."
              fi

              # 3. Start Daemon
              forgejo-runner daemon --config /config/config.yml
          env:
            - name: FORGEJO_INSTANCE_URL
              value: "http://forgejo-service.default.svc.cluster.local:3000"
            - name: FORGEJO_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: FORGEJO_RUNNER_TOKEN
            # Dynamic Name: Uses the pod name (forgejo-runner-0) instead of a hardcoded string
            - name: FORGEJO_RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: config
              mountPath: /config/config.yml
              subPath: config.yml

        # 2. Docker-in-Docker (The Builder)
        - name: docker
          image: docker:dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          volumeMounts:
            - name: runner-data
              mountPath: /data
