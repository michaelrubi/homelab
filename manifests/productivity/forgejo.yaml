# 1. PVCs for Forgejo DB
# forgejo-db-pvc holds the old PG_VERSION=14 data directory. Nothing mounts it
# since the 2026-10 upgrade to 17, but it stays defined here on purpose: it IS
# the rollback, and removing it from this file would let Flux prune it.
# Drop it in a separate change once 17 has run cleanly for a couple of weeks.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-db-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# PG_VERSION=17. Populated from a pg_dumpall of the 14 cluster, not by
# pointing 17 at the old files. See docs/forgejo-postgres-upgrade.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-db-pvc-17
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# 2. PVC for Forgejo Data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
# 3. Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: default
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      securityContext:
        fsGroup: 1000
        # See the fsGroup note in manifests/kustomization.yaml.
        fsGroupChangePolicy: OnRootMismatch
      # Was `nodeName: thinkcentre01`. nodeName bypasses the scheduler
      # entirely: no resource accounting, and a cordoned node still accepts
      # the replacement pod -- so the weekly kured drain in kured.yaml could
      # never actually clear this workload off node01. nodeSelector keeps the
      # same placement while letting cordon/drain work as intended.
      # Nothing here is node-specific (Longhorn volumes attach from any node),
      # so this pin can be dropped entirely once you're happy to let Forgejo
      # move -- worth doing, since Forgejo is Flux's own git source.
      nodeSelector:
        kubernetes.io/hostname: thinkcentre01
      
      # --- ADDED: Fix permissions for Longhorn blank volume ---
      initContainers:
        - name: init-forgejo-data
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # Only walk the tree when the root is wrong (fresh or restored
              # volume). An unconditional chown -R crawled every git object
              # on each restart, including the weekly kured reboot.
              [ "$(stat -c '%u:%g' /data)" = "1000:1000" ] || chown -R 1000:1000 /data
          volumeMounts:
            - name: data
              mountPath: /data

      containers:
        # --- Postgres ---
        - name: postgres
          # DO NOT bump this major version by editing the tag. The data
          # directory on forgejo-db-pvc-17 is PG_VERSION=17; Postgres refuses
          # to start against files from an older major ("database files are
          # incompatible with server"), and Forgejo is Flux's own git source,
          # so that failure takes GitOps down with it.
          #
          # 2026-10: upgraded 14 -> 17 (14 is EOL Nov 2026) by dump and
          # restore into a NEW volume, leaving the 14 volume untouched for
          # rollback. docs/forgejo-postgres-upgrade.md is the procedure;
          # reuse it for the next major.
          image: postgres:17-alpine
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: forgejo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: FORGEJO_DB_PASSWORD
            - name: POSTGRES_DB
              value: forgejo
          # Over TCP on 127.0.0.1, the same path Forgejo uses, rather than
          # the unix socket.
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "forgejo", "-d", "forgejo"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "forgejo", "-d", "forgejo"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 4
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
        # --- Forgejo ---
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:15
          env:
            - name: FORGEJO__database__DB_TYPE
              value: postgres
            - name: FORGEJO__database__HOST
              value: "127.0.0.1:5432"
            - name: FORGEJO__database__NAME
              value: forgejo
            - name: FORGEJO__database__USER
              value: forgejo
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: FORGEJO_DB_PASSWORD
            - name: FORGEJO__server__ROOT_URL
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: FORGEJO_URL
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true" # Assume configured after first run or we rely on auto-setup
            # Admin setup can be done via CLI or initial web UI.
            # We skip auto-admin creation to avoid complex secret handling unless requested.
            - name: FORGEJO__actions__ENABLED
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /data
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 22
              name: ssh
          # /api/healthz includes a database check, so it gates readiness
          # only. Liveness is a plain TCP check: a database blip should take
          # Forgejo out of the Service, not restart it into a crash loop.
          # The startupProbe gives up to 5 minutes for migrations and the
          # cold start after the weekly kured reboot before liveness counts.
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: forgejo-db-pvc-17
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data-pvc
---
# 4. Service
apiVersion: v1
kind: Service
metadata:
  name: forgejo-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: forgejo
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
    - name: ssh
      port: 2222
      targetPort: 22
      protocol: TCP
---
# 5. Runner Config
apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-config
  namespace: default
data:
  config.yml: |
    log:
      level: info
    runner:
      file: /data/runner
      capacity: 1
      timeout: 3h
      envs:
        GITHUB_SERVER_URL: "http://forgejo-service.default.svc.cluster.local:3000"
        DOCKER_HOST: tcp://docker.internal:2375
      # Labels come from config (registration-file labels are a fallback
      # only). act-22.04 is the GitHub-runner-compatible image: git, curl,
      # node, docker CLI included. Docs:
      # https://forgejo.org/docs/next/admin/actions/configuration/#choosing-labels
      labels:
        - "ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-22.04"
        - "docker:docker://ghcr.io/catthehacker/ubuntu:act-22.04"
    cache:
      enabled: true
      dir: /data/cache
    container:
      docker_host: tcp://localhost:2375
      # Official DinD access pattern: job containers reach the dind daemon
      # via DOCKER_HOST above; host-gateway resolves to the pod netns where
      # dockerd listens on 0.0.0.0:2375.
      # https://forgejo.org/docs/next/admin/actions/docker-access/#docker-in-docker
      options: "--add-host=docker.internal:host-gateway"
---
# 6. Runner
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forgejo-runner
  namespace: default
spec:
  serviceName: "forgejo-runner" # Required for StatefulSet networking
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-runner
  # This automatically creates a PVC for each replica (e.g. runner-data-forgejo-runner-0)
  volumeClaimTemplates:
    - metadata:
        name: runner-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "longhorn"
        resources:
          requests:
            storage: 2Gi
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      # See the note on the Forgejo Deployment above.
      nodeSelector:
        kubernetes.io/hostname: thinkcentre01
      volumes:
        - name: config
          configMap:
            name: runner-config
        - name: dind-storage
          emptyDir: {}
      initContainers:
        - name: volume-permissions
          image: busybox:1.36
          # Deliberately NOT guarded like init-forgejo-data: the dind
          # container below mounts this same volume as root, so files deep in
          # the tree can be root-owned while /data itself looks correct. The
          # volume is 2Gi, so the full walk is cheap.
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          volumeMounts:
            - name: runner-data
              mountPath: /data
      containers:
        # 1. The Runner Daemon
        - name: runner
          image: data.forgejo.org/forgejo/runner:12
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
          command:
            - "/bin/sh"
            - "-c"
            - |
              # 1. Wait for Docker (Fixes the crash loop)
              echo "Waiting for Docker daemon..."
              while ! nc -z localhost 2375; do sleep 1; done
              echo "Docker is ready!"

              # 2. Smart Registration (Prevents zombie runners)
              # The config says the file is at /data/runner
              if [ ! -f "/data/runner" ]; then
                echo "Registration file not found. Registering new runner..."
                forgejo-runner register --no-interactive --config /config/config.yml --name $FORGEJO_RUNNER_NAME --instance $FORGEJO_INSTANCE_URL --token $FORGEJO_RUNNER_REGISTRATION_TOKEN --labels docker:docker://ghcr.io/catthehacker/ubuntu:act-22.04,ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-22.04
              else
                echo "Runner already registered. Skipping registration."
              fi

              # 3. Start Daemon
              forgejo-runner daemon --config /config/config.yml
          env:
            - name: FORGEJO_INSTANCE_URL
              value: "http://forgejo-service.default.svc.cluster.local:3000"
            - name: FORGEJO_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: FORGEJO_RUNNER_TOKEN
            # Dynamic Name: Uses the pod name (forgejo-runner-0) instead of a hardcoded string
            - name: FORGEJO_RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: config
              mountPath: /config/config.yml
              subPath: config.yml

        # 2. Docker-in-Docker (The Builder)
        - name: docker
          image: docker:dind
          # dind builds are bursty: a low request keeps it off the
          # scheduler's critical path, the limit stops a runaway build
          # from taking the node down with it.
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
          securityContext:
            privileged: true
          # Explicit hosts replace the entrypoint defaults (which only
          # apply when no command is set). insecure-registry is required
          # to push to the plain-HTTP internal Forgejo registry in Tier 3.
          command:
            - dockerd
            - --host=unix:///var/run/docker.sock
            - --host=tcp://0.0.0.0:2375
            - --tls=false
            - --insecure-registry=forgejo-service.default.svc.cluster.local:3000
            # Pod eth0 MTU is 1230: flannel VXLAN (-50) over Tailscale
            # (1280). Docker bridges default to 1500, so job containers
            # sent oversized packets that were silently dropped -- TLS
            # handshakes to github.com hung ~2.5min and reset, failing
            # validate-manifests' tooling download on most runs. --mtu
            # covers docker0; --default-network-opt covers the per-job
            # WORKFLOW-* networks the runner creates. Verified 2026-10-24:
            # same download timed out at 1500, took 0.85s at 1230.
            - --mtu=1230
            - --default-network-opt=bridge=com.docker.network.driver.mtu=1230
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: dind-storage
              mountPath: /var/lib/docker
