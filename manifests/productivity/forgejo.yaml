# 1. PVC for Forgejo DB
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-db-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# 2. PVC for Forgejo Data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
# 3. Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: default
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        # --- Postgres ---
        - name: postgres
          image: postgres:14-alpine
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: forgejo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: FORGEJO_DB_PASSWORD
            - name: POSTGRES_DB
              value: forgejo
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
        # --- Forgejo ---
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:14
          env:
            - name: FORGEJO__database__DB_TYPE
              value: postgres
            - name: FORGEJO__database__HOST
              value: "127.0.0.1:5432"
            - name: FORGEJO__database__NAME
              value: forgejo
            - name: FORGEJO__database__USER
              value: forgejo
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: FORGEJO_DB_PASSWORD
            - name: FORGEJO__server__ROOT_URL
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: FORGEJO_URL
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true" # Assume configured after first run or we rely on auto-setup
            # Admin setup can be done via CLI or initial web UI.
            # We skip auto-admin creation to avoid complex secret handling unless requested.
          volumeMounts:
            - name: data
              mountPath: /data
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 22
              name: ssh
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: forgejo-db-pvc
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data-pvc
---
# 4. Service
apiVersion: v1
kind: Service
metadata:
  name: forgejo-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: forgejo
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
    - name: ssh
      port: 2222
      targetPort: 22
      protocol: TCP
---
# 5. Runner Config
apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-config
  namespace: default
data:
  config.yml: |
    log:
      level: info
    runner:
      # This file is auto-generated by the registration
      file: /data/runner
      # Number of parallel jobs
      capacity: 1
      # Timeout for jobs
      timeout: 3h
      # Using the internal K8s DNS name so the runner can find the server
      envs:
        GITHUB_SERVER_URL: "http://forgejo-service.default.svc.cluster.local:3000"
    cache:
      enabled: true
      dir: /data/cache
    container:
      # This connects to the dind sidecar below
      docker_host: tcp://localhost:2376
      # IMPORTANT: This allows the runner to pick up "runs-on: docker"
      labels:
        - "docker:docker://node:22-alpine"
        - "ubuntu-latest:docker://node:22-alpine"

---
# 6. Runner
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      volumes:
        - name: runner-data
          emptyDir: {}
        - name: config
          configMap:
            name: runner-config
      containers:
        # 1. The Runner Daemon
        - name: runner
          image: code.forgejo.org/forgejo/runner:3.3.0
          command: ["forgejo-runner", "daemon", "--config", "/config/config.yml"]
          env:
            - name: FORGEJO_INSTANCE_URL
              # Internal Cluster DNS - much faster/safer than public URL
              value: "http://forgejo-service.default.svc.cluster.local:3000"
            - name: FORGEJO_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-secret
                  key: TOKEN
            - name: FORGEJO_RUNNER_NAME
              value: "homelab-runner"
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: config
              mountPath: /config/config.yml
              subPath: config.yml

        # 2. Docker-in-Docker (The Builder)
        # This sidecar actually executes the 'docker build' commands
        - name: docker
          image: docker:dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
            - name: DOCKER_HOST
              value: tcp://localhost:2376
          volumeMounts:
            - name: runner-data
              mountPath: /data