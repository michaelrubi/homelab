# Config Map for CouchDB CORS settings
apiVersion: v1
kind: ConfigMap
metadata:
  name: couchdb-config
  namespace: default
data:
  10-obsidian-cors.ini: |
    [httpd]
    enable_cors = true
    WWW-Authenticate = Basic realm="administrator"

    [couchdb]
    max_document_size = 4294967296
    # Pin the server UUID -- this is the fix for "Obsidian sync dies every
    # few days on every device at once" (diagnosed 2026-09-19).
    #
    # CouchDB generates a UUID at first start and persists it to the LAST
    # file in its config chain, which is /opt/couchdb/etc/local.d/docker.ini
    # (the entrypoint's file, sorted after this one). That directory is the
    # couchdb-config-writable emptyDir below, so it is wiped on every pod
    # start and CouchDB minted a brand-new random UUID each time.
    #
    # That is not cosmetic. PouchDB -- what Obsidian LiveSync runs -- derives
    # its replication checkpoint id from server_uuid + db_name. A new UUID
    # invalidates every device's checkpoint simultaneously and forces a full
    # change-feed rescan, which reads to the user as "sync stopped working".
    # Restarts here are frequent: kured reboots a node every Sunday, the
    # reloader annotation restarts on any secret/configmap change, and Flux
    # rolls on any manifest edit. That is the "every few days" cadence.
    #
    # The evidence was four _local checkpoint docs in the homelab db: two at
    # rev 0-769 (the long-lived pre-restart pair) and two at rev 0-18/0-19
    # minted after a recent rollout, with the live feed crawling history 25
    # changes at a time.
    #
    # This value is the UUID that was live when the pin was added, so the
    # rollout that applies it preserves the existing checkpoints. Do not
    # change it -- changing it re-breaks every device.
    uuid = 43f90d1dc4ee24124951503aec511e69

    [chttpd]
    enable_cors = true
    require_valid_user = true
    max_http_request_size = 4294967296

    [chttpd_auth]
    require_valid_user = true

    [cors]
    credentials = true
    headers = accept, authorization, content-type, origin, referer
    methods = GET, PUT, POST, HEAD, DELETE
    # app://obsidian.md is for Desktop
    # capacitor://localhost is for Mobile
    # http://localhost is for local testing
    origins = app://obsidian.md,capacitor://localhost,http://localhost
---
# Persistent Storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: couchdb-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: couchdb
  namespace: default
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: couchdb
  template:
    metadata:
      labels:
        app: couchdb
    spec:
      securityContext:
        fsGroup: 1000
        # See the fsGroup note in manifests/kustomization.yaml.
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
      - name: copy-config
        image: couchdb:3.5.3
        command: ['sh', '-c', 'cp /tmp/config/10-obsidian-cors.ini /opt/couchdb/etc/local.d/10-obsidian-cors.ini']
        volumeMounts:
        - name: couchdb-config-source
          mountPath: /tmp/config
        - name: couchdb-config-writable
          mountPath: /opt/couchdb/etc/local.d
      containers:
      - name: couchdb
        image: couchdb:3.5.3
        env:
        - name: COUCHDB_USER
          valueFrom:
            secretKeyRef:
              name: obsidian-secrets
              key: COUCHDB_USER
        - name: COUCHDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: obsidian-secrets
              key: COUCHDB_PASSWORD
        # Same emptyDir problem as the UUID above: without this the
        # entrypoint has no value to write, so CouchDB generates the
        # cookie-auth secret at runtime and loses it on every restart,
        # invalidating any outstanding AuthSession cookie. LiveSync itself
        # uses Basic auth, so this is belt-and-braces rather than the bug,
        # but it makes the whole auth surface restart-stable.
        - name: COUCHDB_SECRET
          valueFrom:
            secretKeyRef:
              name: obsidian-secrets
              key: COUCHDB_SECRET
        ports:
        - containerPort: 5984
        lifecycle:
          postStart:
            exec:
              command:
                - sh
                - -c
                - |
                  for i in $(seq 1 60); do
                    if curl -s -o /dev/null -w '%{http_code}' -u "$COUCHDB_USER:$COUCHDB_PASSWORD" http://localhost:5984/_all_dbs 2>/dev/null | grep -q 200; then
                      curl -s -X PUT -u "$COUCHDB_USER:$COUCHDB_PASSWORD" http://localhost:5984/_users >/dev/null 2>&1 || true
                      curl -s -X PUT -u "$COUCHDB_USER:$COUCHDB_PASSWORD" http://localhost:5984/_replicator >/dev/null 2>&1 || true
                      curl -s -X PUT -u "$COUCHDB_USER:$COUCHDB_PASSWORD" http://localhost:5984/_global_changes >/dev/null 2>&1 || true
                      break
                    fi
                    sleep 1
                  done
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
        volumeMounts:
        - name: couchdb-data
          mountPath: /opt/couchdb/data
        - name: couchdb-config-writable
          mountPath: /opt/couchdb/etc/local.d
      volumes:
      - name: couchdb-data
        persistentVolumeClaim:
          claimName: couchdb-pvc
      - name: couchdb-config-source
        configMap:
          name: couchdb-config
      - name: couchdb-config-writable
        emptyDir: {}
---
# The Service
apiVersion: v1
kind: Service
metadata:
  name: obsidian-sync-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: couchdb
  ports:
    - port: 5984
      targetPort: 5984
      protocol: TCP
---
# LiveSync device staleness check (2026-11-03)
#
# The server can be perfectly healthy while every device but one has quietly
# stopped syncing. Found 2026-11-03: the phone (plugin 0.25.36) had not
# checked in since 2026-09-18 and the Mac Mini not since the 2026-09-02
# rebuild, while the laptop on 1.0.x kept writing happily. LiveSync 1.0
# refuses or pauses clients on an older feature set, and nothing on the
# server side logs that -- the old clients simply stop showing up.
#
# Each device stamps node_info[<id>].last_connected in the milestone doc when
# it connects. This job fails if any device in LIVESYNC_NODES is missing or
# older than MAX_AGE_HOURS. LiveSyncDeviceStale in reliability-alerts.yaml
# fires off the job's last successful run, so it clears by itself once the
# device is back, rather than KubeJobFailed, which latches until the failed
# Job object is deleted. To see which device is stale:
#   kubectl -n default create job --from=cronjob/livesync-staleness ls-check \
#     --dry-run=client -o json | jq 'del(.metadata.ownerReferences)' \
#     | kubectl create -f - \
#     && kubectl -n default logs -f job/ls-check --pod-running-timeout=1m
#   kubectl -n default delete job ls-check
# The ownerReferences strip matters: a plain `create job --from` is owned by
# this CronJob, and failedJobsHistoryLimit: 0 has the controller delete it the
# moment it fails, before its logs can be read.
#
# A device that is simply switched off goes stale too and needs nothing but
# turning on (2026-11-06: the Mac Mini, off for 63h, tripped this and cleared
# on power-up). Reset a device only if it is on and still not connecting.
#
# Node IDs are per device and get re-minted when a device's local database is
# rebuilt. After a "Reset Synchronisation on This Device" (the old "Fetch from
# remote") check the milestone doc and update the list here.
#
# Unverified: last_connected is stamped when a device connects, and it is not
# yet known whether a device that stays open in LiveSync mode for days
# re-stamps it. If the always-on Mac Mini trips this while plainly syncing,
# that is why, and the threshold needs raising rather than the device fixing.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: livesync-staleness
  namespace: default
  labels:
    app: livesync-check
spec:
  schedule: "17 * * * *"
  timeZone: "America/Phoenix"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  # 0 so a failed run never latches KubeJobFailed; the staleness alert is the
  # signal, and a manual run (above) shows the details.
  failedJobsHistoryLimit: 0
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: livesync-check
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
          containers:
          - name: check
            image: python:3.13-alpine
            env:
            # laptop, phone, Mac Mini, as of the 2026-11-03 rebuild
            - name: LIVESYNC_NODES
              value: "qcfuzbcb0d kk7cs1w31v 4l5mjtn07i"
            - name: MAX_AGE_HOURS
              value: "48"
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: obsidian-secrets
                  key: COUCHDB_USER
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: obsidian-secrets
                  key: COUCHDB_PASSWORD
            command: ["python3", "-c"]
            args:
              - |
                import base64, json, os, sys, time, urllib.request
                url = "http://obsidian-sync-service:5984/homelab/_local/obsydian_livesync_milestone"
                auth = base64.b64encode(f"{os.environ['COUCHDB_USER']}:{os.environ['COUCHDB_PASSWORD']}".encode()).decode()
                req = urllib.request.Request(url, headers={"Authorization": f"Basic {auth}"})
                # A new pod is blocked for a second or two until the network
                # policy controller learns its IP.
                for attempt in range(15):
                    try:
                        doc = json.load(urllib.request.urlopen(req, timeout=10))
                        break
                    except OSError as e:
                        err = e
                        time.sleep(2)
                else:
                    sys.exit(f"cannot read milestone doc: {err}")
                info = doc.get("node_info", {})
                limit = float(os.environ["MAX_AGE_HOURS"])
                stale = 0
                for node in os.environ["LIVESYNC_NODES"].split():
                    n = info.get(node)
                    if not n:
                        print(f"STALE {node}: no node_info, has never connected since the last rebuild")
                        stale += 1
                        continue
                    age = (time.time() - n["last_connected"] / 1000) / 3600
                    state = "STALE" if age > limit else "ok"
                    stale += state == "STALE"
                    print(f"{state} {node}: {n.get('device_name')} plugin {n.get('plugin_version')}, last connected {age:.1f}h ago")
                versions = {info[n].get("plugin_version") for n in os.environ["LIVESYNC_NODES"].split() if n in info}
                if len(versions) > 1:
                    print(f"note: mixed plugin versions {sorted(versions)}")
                sys.exit(1 if stale else 0)
            resources:
              requests:
                memory: "32Mi"
                cpu: "10m"
              limits:
                memory: "64Mi"