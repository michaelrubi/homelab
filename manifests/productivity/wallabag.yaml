# 1. PVC for Wallabag Images
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wallabag-images-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# 2. PVC for Wallabag Data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wallabag-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# 3. Wallabag Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallabag
  namespace: default
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wallabag
  template:
    metadata:
      labels:
        app: wallabag
    spec:
      securityContext:
        fsGroup: 33
      containers:
        - name: wallabag
          image: wallabag/wallabag:2.6.14
          ports:
            - containerPort: 80
              name: http
          # --- HARDENING ---
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            # Database Configuration
            - name: SYMFONY__ENV__DATABASE_DRIVER
              value: "pdo_pgsql"
            - name: SYMFONY__ENV__DATABASE_HOST
              value: "postgres"
            - name: SYMFONY__ENV__DATABASE_PORT
              value: "5432"
            - name: SYMFONY__ENV__DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: wallabag-secrets
                  key: WALLABAG_DB_NAME
            - name: SYMFONY__ENV__DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: wallabag-secrets
                  key: WALLABAG_DB_USER
            - name: SYMFONY__ENV__DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wallabag-secrets
                  key: WALLABAG_DB_PASSWORD
            # Wallabag Secret
            - name: SYMFONY__ENV__SECRET
              valueFrom:
                secretKeyRef:
                  name: wallabag-secrets
                  key: SYMFONY__ENV__SECRET
            # Server Configuration
            - name: SYMFONY__ENV__DOMAIN_NAME
              value: "https://wallabag.robin-mine.ts.net"
            # Mailer Configuration (optional, can be configured later)
            - name: SYMFONY__ENV__MAILER_DSN
              value: "smtp://localhost"
            # Redis for caching (optional)
            - name: SYMFONY__ENV__REDIS_DSN
              value: "redis://localhost:6379"
          volumeMounts:
            - name: wallabag-images
              mountPath: /var/www/wallabag/web/assets/images
            - name: wallabag-data
              mountPath: /var/www/wallabag/data
      volumes:
        - name: wallabag-images
          persistentVolumeClaim:
            claimName: wallabag-images-pvc
        - name: wallabag-data
          persistentVolumeClaim:
            claimName: wallabag-data-pvc
---
# 4. Service
apiVersion: v1
kind: Service
metadata:
  name: wallabag-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: wallabag
  ports:
    - name: http
      port: 8083
      targetPort: 80
      protocol: TCP
