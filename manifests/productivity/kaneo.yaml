# Kaneo — open-source project management (kanban/tasks/projects).
# Single container runs both the Hono API (port 1337 inside the container)
# and the static web frontend served by nginx (port 5173). The bundled
# entrypoint (/usr/local/bin/kaneo-entrypoint.sh) starts the Node API
# first, waits for /api/health to come up, then launches nginx in the
# foreground — so we probe nginx on :5173 (the public surface).
#
# KANEO_API_URL is derived automatically from KANEO_CLIENT_URL at runtime
# by the entrypoint (it just appends "/api"). We still set it explicitly
# via Secret so the value is obvious in `kubectl describe`.
#
# DATABASE_URL is not set anywhere: the image's entrypoint builds it from
# POSTGRES_HOST / POSTGRES_PORT below plus POSTGRES_USER / POSTGRES_PASSWORD /
# POSTGRES_DB from kaneo-db-secrets -- the same Secret kaneo-postgres reads,
# so there is one copy of the password instead of two to keep in lockstep.
#
# 2026-10-24: it used to come from kaneo-secrets.DATABASE_URL. Commit 4fd8b34
# (2026-09-20) re-encrypted secrets.sops.yaml from a stale plaintext copy and
# silently dropped that key. The running pod kept its old environment for five
# weeks, so nothing noticed until the next restart crash-looped with
# "DATABASE_URL is not set and POSTGRES_PASSWORD is not set".
#
# Rotating the password is still a two-step operation, because POSTGRES_PASSWORD
# only takes effect at first init — an already-initialized volume ignores it:
#   1. ALTER USER kaneo WITH PASSWORD '<new>';  in the kaneo-postgres pod
#   2. update kaneo-db-secrets.POSTGRES_PASSWORD in secrets.sops.yaml
# Skip step 1 and the pod fails with "password authentication failed".
#
# Public hostname kaneo.rubiconetic.com is routed via the Cloudflare
# tunnel dashboard → http://kaneo-service.default.svc.cluster.local:5173.
# Service stays ClusterIP; cloudflared does the public ingress.
#
# Recreate strategy + Reloader annotation handle secret-driven restarts.
---
apiVersion: v1
kind: Service
metadata:
  name: kaneo-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: kaneo
  ports:
    - name: http
      port: 5173
      targetPort: 5173
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaneo
  namespace: default
  annotations:
    # Restarts the pod when kaneo-secrets changes.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kaneo
  template:
    metadata:
      labels:
        app: kaneo
    spec:
      securityContext:
        fsGroup: 1001
        # See the fsGroup note in manifests/kustomization.yaml.
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: kaneo
          # Pinned to 2.12.1 (2026-07-30 release; Chart.yaml + GHCR both match).
          # Upstream tags do NOT carry a `v` prefix here (compose.yml uses
          # :latest, but the chart and workflow build with bare semver).
          # imagePullPolicy default = IfNotPresent; kubelet skips re-pull when
          # the local digest matches.
          image: ghcr.io/usekaneo/kaneo:2.32.0
          ports:
            - name: http
              containerPort: 5173
              protocol: TCP
          envFrom:
            - secretRef:
                name: kaneo-secrets
            - secretRef:
                name: kaneo-db-secrets
          env:
            - name: POSTGRES_HOST
              value: "kaneo-postgres"
            - name: POSTGRES_PORT
              value: "5432"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              # Sized for one Node process (Hono + Drizzle + better-auth +
              # MCP server + croner cron jobs) plus nginx. First-run
              # Drizzle migrations can transiently spike; 2Gi gives headroom.
              memory: "2Gi"
          livenessProbe:
            # nginx on :5173 is the public surface; /api/health proxies to
            # the Hono API on :1337 inside the container.
            httpGet:
              path: /api/health
              port: 5173
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5173
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5