apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-grid
  namespace: default
  annotations:
    # Restarts the pod if you update your encrypted secrets
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: the-grid
  template:
    metadata:
      labels:
        app: the-grid
    spec:
      # 1. Credentials to pull your private image from Forgejo
      imagePullSecrets:
        - name: forgejo-registry-secret

      containers:
        - name: the-grid
          image: git.rubiconetic.com/rubiconetic/the-grid:v0.2.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http

          env:
            # --- APPLICATION CONFIG ---
            - name: BODY_SIZE_LIMIT
              value: "Infinity"
            # --- POCKETBASE CONFIG (EXTERNAL) ---
            - name: POCKETBASE_URL
              valueFrom:
                secretKeyRef:
                  name: the-grid-secrets
                  key: POCKETBASE_URL
            - name: PUBLIC_POCKETBASE_URL
              valueFrom:
                secretKeyRef:
                  name: the-grid-secrets
                  key: PUBLIC_POCKETBASE_URL
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: the-grid-secrets
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: the-grid-secrets
                  key: ADMIN_PASSWORD
            - name: SVELTE_CLAW_URL
              valueFrom:
                secretKeyRef:
                  name: the-grid-secrets
                  key: SVELTE_CLAW_URL
            - name: ORIGIN
              valueFrom:
                secretKeyRef:
                  name: the-grid-secrets
                  key: ORIGIN

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: the-grid-service
  namespace: default
spec:
  # Exposes the service on your Tailscale/Internal Network IP
  type: LoadBalancer
  selector:
    app: the-grid
  ports:
    - name: http
      port: 5717
      targetPort: 3000
      protocol: TCP
