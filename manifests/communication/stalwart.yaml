# Stalwart Mail Server (https://stalw.art)
#
# Self-hosted mail server providing SMTP/IMAP/JMAP for the rubiconetic.com
# domain. Used for transactional email (reminders, opt-in newsletters) sent
# via n8n + SMTP, and for receiving mail at user@rubiconetic.com via the
# public MX.
#
# Layout:
#   * /etc/stalwart   — config PVC (writable: wizard writes config.toml here,
#                       ACME writes cert + account key here)
#   * /var/lib/stalwart — data PVC (RocksDB blobs, indexes, queues)
#
# Ingress:
#   * Public HTTPS admin + JMAP via Cloudflared tunnel -> ClusterIP service
#     on port 8080 (this manifest exposes 8080, not 443 — admin UI is HTTP).
#     Once ACME issues a cert, switch the tunnel to HTTPS and add tls =
#     "implicit" to the http listener in the admin UI.
#   * SMTP/IMAP/POP3 via Tailscale LoadBalancer service. Port 25 is what
#     external senders connect to for MX delivery.
---
# 1. PVC for /etc/stalwart (config + certs + wizard writes).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stalwart-config-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
# 2. PVC for mail data (RocksDB blobs, indexes, queue spillover).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stalwart-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
# 3. ClusterIP Service for HTTP (admin + JMAP via Cloudflared tunnel).
# Port 8080 is the admin UI; same port serves JMAP. Cloudflared tunnel
# points mail.rubiconetic.com -> http://stalwart-http.default.svc.cluster.local:8080
apiVersion: v1
kind: Service
metadata:
  name: stalwart-http
  namespace: default
  labels:
    app: stalwart
spec:
  type: ClusterIP
  selector:
    app: stalwart
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: submission
      port: 587
      targetPort: 587
      protocol: TCP
---
# 4. Tailscale LoadBalancer Service for SMTP / IMAP / POP3.
apiVersion: v1
kind: Service
metadata:
  name: stalwart-mail
  namespace: default
  labels:
    app: stalwart
spec:
  type: LoadBalancer
  selector:
    app: stalwart
  ports:
    - name: smtp
      port: 25
      targetPort: 25
      protocol: TCP
    - name: submission
      port: 587
      targetPort: 587
      protocol: TCP
    - name: smtps
      port: 465
      targetPort: 465
      protocol: TCP
    - name: imap
      port: 143
      targetPort: 143
      protocol: TCP
    - name: imaps
      port: 993
      targetPort: 993
      protocol: TCP
    - name: pop3
      port: 110
      targetPort: 110
      protocol: TCP
    - name: pop3s
      port: 995
      targetPort: 995
      protocol: TCP
    - name: managesieve
      port: 4190
      targetPort: 4190
      protocol: TCP
---
# 5. Deployment. Two writable PVCs, fsGroup 2000 so both are owned by the
# stalwart user inside the container. NO init container — the longhorn
# fsGroup ownership on a fresh PVC does the right thing on first attach.
# NO ConfigMap mounted at /etc/stalwart — Stalwart's wizard writes its
# generated config.toml there, and the binary uses sensible defaults
# (RocksDB + SQLite, listeners on all the mail ports) when no config.toml
# exists yet. After the wizard runs, this works as expected.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalwart
  namespace: default
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stalwart
  template:
    metadata:
      labels:
        app: stalwart
    spec:
      securityContext:
        fsGroup: 2000
      containers:
        - name: stalwart
          image: stalwartlabs/stalwart:v0.16
          imagePullPolicy: IfNotPresent
          env:
            - name: STALWART_RECOVERY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: stalwart-secrets
                  key: STALWART_RECOVERY_ADMIN
            - name: STALWART_PUBLIC_URL
              value: "https://mail.rubiconetic.com"
          ports:
            - name: smtp
              containerPort: 25
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: submission
              containerPort: 587
              protocol: TCP
            - name: smtps
              containerPort: 465
              protocol: TCP
            - name: imap
              containerPort: 143
              protocol: TCP
            - name: imaps
              containerPort: 993
              protocol: TCP
            - name: pop3
              containerPort: 110
              protocol: TCP
            - name: pop3s
              containerPort: 995
              protocol: TCP
            - name: managesieve
              containerPort: 4190
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
          volumeMounts:
            - name: config
              mountPath: /etc/stalwart
            - name: data
              mountPath: /var/lib/stalwart
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: stalwart-config-pvc
        - name: data
          persistentVolumeClaim:
            claimName: stalwart-data-pvc