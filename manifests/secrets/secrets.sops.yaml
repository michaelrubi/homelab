# Kaneo (project management — usekaneo/kaneo)
# kaneo-db-secrets: postgres credentials for the dedicated Kaneo DB pod.
# kaneo-secrets: AUTH_SECRET (better-auth session signing), KANEO_CLIENT_URL /
# KANEO_API_URL (used by env.sh to substitute placeholders in the web bundle
# at runtime), CORS_ORIGINS locked to the public hostname.
# DATABASE_URL is set directly on the Deployment (see kaneo.yaml) for
# visibility — keep that value in sync if you ever rotate this password.
# Tunnel route required (Cloudflare dashboard, not cloudflared.yaml):
# kaneo.rubiconetic.com → http://kaneo-service.default.svc.cluster.local:5173
apiVersion: v1
kind: Secret
metadata:
    name: kaneo-db-secrets
    namespace: default
type: Opaque
