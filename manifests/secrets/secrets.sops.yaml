#     the initial admin account so we don't have to fish the bootstrap password
#     out of pod logs. Change the password after first login at /admin.
#   PUBLIC_URL: the From: domain used in headers + autodiscover. Not really a
#     secret value, but kept here so the deployment manifest stays declarative.
#   CF_API_TOKEN: Cloudflare API token (DNS Edit scope on rubiconetic.com) used
#     later for ACME DNS-01 challenges so certs renew without inbound HTTP.
