---
# Sidecar config for the openai-rewrite-proxy that runs alongside the postiz
# monolith (see manifests/social/postiz-app.yaml). Postiz's NestJS backend
# constructs an openai-node SDK client with no explicit baseURL, so the
# SDK reads process.env.OPENAI_BASE_URL. We point that at
# http://localhost:8080/v1 — this sidecar intercepts every chat/image call
# and rewrites the hardcoded 'model' field to one that OpenRouter accepts,
# then forwards to https://openrouter.ai/api/v1/ with the OpenRouter key.
#
# Rewrite map (kept here so it's obvious what's being translated):
#   "model":"gpt-4.1"            → "model":"minimax/minimax-m3"
#   "model":"chatgpt-image-latest" → "model":"openai/gpt-image-1"
#
# If upstream Postiz adds a new hardcoded model name, add a row to MODEL_MAP.
# Everything else (messages, temperature, tools, response_format, etc.)
# passes through untouched.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postiz-ai-proxy
  namespace: default
data:
  server.js: |
    // Express-based openai-rewrite-proxy for Postiz ↔ OpenRouter.
    // Listens on :8080. Forwards /v1/* to https://openrouter.ai/api/v1/*
    // rewriting the 'model' field of the JSON request body. Streams the
    // response back to the client unchanged.
    //
    // Required env: OPENAI_API_KEY (the OpenRouter key, forwarded as bearer)
    // Optional:     OPENROUTER_BASE (default https://openrouter.ai/api/v1)
    //               OPENAI_REFERER (sent as HTTP-Referer for OpenRouter stats)
    //               OPENAI_TITLE   (sent as X-Title for OpenRouter stats)

    import express from 'express';
    import { Readable } from 'node:stream';

    const MODEL_MAP = Object.freeze({
      'gpt-4.1': 'minimax/minimax-m3',
      'gpt-4.1-mini': 'minimax/minimax-m3',
      'gpt-4.1-nano': 'minimax/minimax-m3',
      'chatgpt-image-latest': 'openai/gpt-image-1',
      'dall-e-3': 'openai/gpt-image-1',
    });

    const PORT = 8080;
    const UPSTREAM = process.env.OPENROUTER_BASE || 'https://openrouter.ai/api/v1';
    const KEY = process.env.OPENAI_API_KEY;
    if (!KEY) {
      console.error('FATAL: OPENAI_API_KEY not set');
      process.exit(1);
    }

    const app = express();
    // Large body cap — Postiz never sends huge payloads here, but be safe.
    app.use(express.json({ limit: '10mb' }));

    app.use(async (req, res) => {
      // Rewrite model field if it's a known hardcoded name.
      if (req.body && typeof req.body.model === 'string') {
        const mapped = MODEL_MAP[req.body.model];
        if (mapped) {
          req.body.model = mapped;
        }
      }
      // Build the upstream URL. UPSTREAM already ends in /v1 and req.originalUrl
      // starts with /v1 (because Postiz hits OPENAI_BASE_URL + "/chat/completions"
      // etc., where OPENAI_BASE_URL ends with /v1). Strip the leading /v1 so we
      // don't end up with /v1/v1/chat/completions at OpenRouter.
      const path = req.originalUrl.replace(/^\/v1(?=\/|$)/, '') || '/';
      const upstreamRes = await fetch(`${UPSTREAM}${path}`, {
        method: req.method,
        headers: {
          'Authorization': `Bearer ${KEY}`,
          'Content-Type': 'application/json',
          'HTTP-Referer': process.env.OPENAI_REFERER || 'https://postiz.rubiconetic.com',
          'X-Title': process.env.OPENAI_TITLE || 'Postiz',
        },
        body: ['GET', 'HEAD'].includes(req.method) ? undefined : JSON.stringify(req.body),
      });

      // Pipe response status, headers, and body back unchanged.
      res.status(upstreamRes.status);
      upstreamRes.headers.forEach((v, k) => {
        // Strip hop-by-hop and content-encoding (we forward decoded already).
        if (['content-encoding', 'transfer-encoding', 'connection'].includes(k)) return;
        res.setHeader(k, v);
      });
      if (upstreamRes.body) {
        Readable.fromWeb(upstreamRes.body).pipe(res);
      } else {
        res.end();
      }
    });

    app.listen(PORT, '0.0.0.0', () => {
      console.log(`openai-rewrite-proxy listening on 0.0.0.0:${PORT}, upstream=${UPSTREAM}`);
    });

  package.json: |
    {
      "name": "postiz-ai-proxy",
      "version": "0.1.0",
      "type": "module",
      "private": true,
      "dependencies": {
        "express": "^4.21.0"
      }
    }