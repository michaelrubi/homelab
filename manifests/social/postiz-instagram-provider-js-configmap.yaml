# Patched instagram.provider.js — overrides the file baked into the
# postiz upstream image at runtime via a subPath mount, because Meta
# rejected IG FB Login OAuth requests with "Invalid Scopes" for new apps
# as of mid-2026. The fix (replacing instagram_<x> with
# instagram_business_<x> in the OAuth scope list) is the same patch as
# upstream PR for issue #1578. Once upstream merges, this ConfigMap
# becomes obsolete — remove both the volume and mount from
# postiz-app.yaml in the same commit that bumps the image.
#
# This file is generated from a runtime extraction of the upstream
# compiled JS via `kubectl exec ... cat ...`. Re-generate by:
#   1. kubectl exec -n default -c postiz -- \
#        sed <patch> /app/apps/backend/dist/.../instagram.provider.js
#   2. kubectl exec -n default -c postiz -- \
#        cat /app/apps/backend/dist/.../instagram.provider.js \
#        > /tmp/patched.js
#   3. base64 /tmp/patched.js and paste into the binaryData value below
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postiz-instagram-provider-js
  namespace: default
binaryData:
  # compiled JS file content, base64-encoded (k8s decodes before mount).
  # The postiz-app subPath volumeMount exposes this verbatim as
  # /app/apps/backend/dist/.../instagram.provider.js inside the postiz
  # container, shadowing the upstream image's copy.
  instagram-provider.js: |
    
