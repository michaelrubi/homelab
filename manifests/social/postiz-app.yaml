# Postiz monolith — single pod running nginx + 3 Node processes via pm2:
#   - backend (NestJS API, port 3000)
#   - frontend (NextJS, port 4200)
#   - orchestrator (NestJS Temporal worker, healthcheck on 3002)
# Nginx on :5000 inside the container fronts all three (see upstream image).
#
# Two durable volumes:
#   /uploads  — user-uploaded media (avatars, post media)
#   /config   — Prisma client output, JWT signing material, app state
#
# Resources sized for 3 Node processes (backend + frontend + orchestrator
# all in one pod). Recreate strategy because of /config + /uploads mounts.
# Reloader annotation restarts the pod when postiz-secrets changes.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postiz-uploads-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postiz-config-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postiz-service
  namespace: default
spec:
  # Tailscale LoadBalancer — only reachable from your tailnet.
  # Cloudflared tunnel routes postiz.rubiconetic.com → this Service:5000.
  type: LoadBalancer
  selector:
    app: postiz
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postiz
  namespace: default
  annotations:
    # Restarts the pod if you update postiz-secrets
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postiz
  template:
    metadata:
      labels:
        app: postiz
    spec:
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
        # Pulls ghcr.io/rubiconetic/postiz-ai-proxy from a private GHCR
        # package. The postiz main image is public GHCR (gitroomhq) and
        # doesn't need this secret, but listing it at the pod level makes
        # kubelet try the secret on every pull — harmless for public
        # images, keeps the secret in one place.
        - name: ghcr-pull-secret
      containers:
        - name: postiz
          # Pinned to v2.21.10 (2026-06-22) — fixes PSA-2026-NWZN9J.
          # IMPORTANT: upstream tags carry the v prefix (CONTAINERVER = github.ref_name).
          # Pinning to bare 2.21.10 returns 404 MANIFEST_UNKNOWN on GHCR.
          # imagePullPolicy: IfNotPresent lets the kubelet skip re-pulling when the
          # local digest matches — equivalent to what :latest gives you, but with a
          # reproducible identity across reconciles.
          image: ghcr.io/gitroomhq/postiz-app:v2.21.10
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          # IS_GENERAL=true unlocks the Settings → Developers tab (the frontend
          # gates public-api/Apps UI on process.env.IS_GENERAL). Matches what the
          # upstream docker-compose.yaml:16 sets. Backend endpoints already work
          # without it; this just restores the UI to create/rotate API keys.
          env:
            - name: IS_GENERAL
              value: "true"
          envFrom:
            - secretRef:
                name: postiz-secrets
          resources:
            requests:
              # 2026-09-11: was 512Mi while the pod actually held ~2.4Gi.
              # The scheduler places pods on requests, not usage, so this
              # one understatement made node01 look ~1.8Gi emptier than it
              # was -- which is how 68 pods ended up on one 8Gi node while
              # node02 ran a single workload. Request what it really uses.
              memory: "2Gi"
              cpu: "200m"
            limits:
              # Sized for 3 Node processes (backend + frontend + orchestrator)
              # plus Prisma first-run schema push which spikes to ~3Gi during
              # the initial db push on a fresh database. 4Gi gives headroom.
              memory: "4Gi"
          livenessProbe:
            # nginx on :5000 is the public surface — probe that.
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: uploads
              mountPath: /uploads
            - name: config
              mountPath: /config
            # subPath overlay of instagram.provider.js from the
            # postiz-instagram-provider-js ConfigMap. Replaces the
            # upstream image's copy with a version using
            # instagram_business_* scope names (Meta deprecation). See
            # postiz-instagram-provider-js-configmap.yaml for the source
            # and postiz-app#1578 for the upstream bug. Remove both the
            # volume and this mount once upstream merges the fix.
            # Re-checked 2026-09-18: #1578 is still open, patch still needed.
            - name: ig-scope-patch
              subPath: instagram-provider.js
              mountPath: /app/apps/backend/dist/libraries/nestjs-libraries/src/integrations/social/instagram.provider.js
              readOnly: true
            - name: ig-scope-patch
              subPath: instagram-provider.js
              mountPath: /app/apps/orchestrator/dist/libraries/nestjs-libraries/src/integrations/social/instagram.provider.js
              readOnly: true
        # Sidecar: openai-rewrite-proxy. Postiz's openai-node SDK reads
        # process.env.OPENAI_BASE_URL (set to http://localhost:8080/v1),
        # so every chat call hits this sidecar. The sidecar rewrites
        # Postiz's hardcoded 'model' field to 'minimax/minimax-m3' and
        # forwards to OpenRouter. Image has node_modules + server.js
        # baked in (see manifests/social/postiz-ai-proxy/Dockerfile),
        # so no init container / emptyDir / ConfigMap source mount is
        # needed. Bump the tag in the image: line when you rebuild.
        - name: openai-rewrite-proxy
          image: ghcr.io/rubiconetic/postiz-ai-proxy:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: proxy
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: postiz-secrets
          env:
            # The postiz container reads OPENAI_BASE_URL=http://localhost:8080/v1
            # to send SDK calls here. The sidecar itself doesn't use this var
            # (it hardcodes UPSTREAM below), but listing it keeps the contract
            # explicit in one place.
            - name: OPENAI_BASE_URL
              value: "http://localhost:8080/v1"
            - name: OPENAI_REFERER
              value: "https://postiz.rubiconetic.com"
            - name: OPENAI_TITLE
              value: "Postiz"
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
          # 2026-09-11: these were httpGet on "/", which this sidecar does
          # NOT serve -- server.js is a single catch-all app.use() that
          # forwards every path upstream. So each probe made a real billed
          # call to OpenRouter, got a 404 back, and kubelet counted it as a
          # failure: 1961 restarts, and ~8600 junk upstream requests a day.
          #
          # tcpSocket is the correct check for the deployed 0.1.0 image: it
          # verifies the listener is accepting connections without inventing
          # a route that does not exist. server.js now has a /healthz route
          # for a future rebuild -- once the image is bumped past 0.1.0,
          # these can become httpGet on /healthz for a real liveness signal.
          livenessProbe:
            tcpSocket:
              port: proxy
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: proxy
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: postiz-uploads-pvc
        - name: config
          persistentVolumeClaim:
            claimName: postiz-config-pvc
        # Source of the patched instagram.provider.js used by the
        # volumeMount above. See postiz-instagram-provider-js-configmap.yaml
        # for the content and postiz-app#1578 for the upstream fix.
        - name: ig-scope-patch
          configMap:
            name: postiz-instagram-provider-js
            items:
              - key: instagram-provider.js
                path: instagram-provider.js