# Postiz monolith — single pod running nginx + 3 Node processes via pm2:
#   - backend (NestJS API, port 3000)
#   - frontend (NextJS, port 4200)
#   - orchestrator (NestJS Temporal worker, healthcheck on 3002)
# Nginx on :5000 inside the container fronts all three (see upstream image).
#
# Two durable volumes:
#   /uploads  — user-uploaded media (avatars, post media)
#   /config   — Prisma client output, JWT signing material, app state
#
# Resources sized for 3 Node processes (backend + frontend + orchestrator
# all in one pod). Recreate strategy because of /config + /uploads mounts.
# Reloader annotation restarts the pod when postiz-secrets changes.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postiz-uploads-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postiz-config-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postiz-service
  namespace: default
spec:
  # Tailscale LoadBalancer — only reachable from your tailnet.
  # Cloudflared tunnel routes postiz.rubiconetic.com → this Service:5000.
  type: LoadBalancer
  selector:
    app: postiz
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postiz
  namespace: default
  annotations:
    # Restarts the pod if you update postiz-secrets
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postiz
  template:
    metadata:
      labels:
        app: postiz
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        # Init container: copies the ConfigMap source into a writable emptyDir
        # at /proxy and runs npm install there. The ConfigMap is mounted
        # read-only at the kernel level, so we can't run npm in place —
        # copying + installing into the same emptyDir the sidecar reads
        # from solves both the read-only issue and avoids paying the npm
        # install tax on every pod restart.
        - name: ai-proxy-init
          image: node:20-alpine
          imagePullPolicy: IfNotPresent
          workingDir: /proxy
          command: ["sh", "-c", "cp /proxy-src/* /proxy/ && cd /proxy && npm install --omit=dev --no-audit --no-fund && ls -la /proxy/ && echo 'init done'"]
          volumeMounts:
            - name: ai-proxy-src
              mountPath: /proxy-src
              readOnly: true
            - name: ai-proxy-out
              mountPath: /proxy
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      containers:
        - name: postiz
          # Pinned to v2.21.10 (2026-06-22) — fixes PSA-2026-NWZN9J.
          # IMPORTANT: upstream tags carry the v prefix (CONTAINERVER = github.ref_name).
          # Pinning to bare 2.21.10 returns 404 MANIFEST_UNKNOWN on GHCR.
          # imagePullPolicy: IfNotPresent lets the kubelet skip re-pulling when the
          # local digest matches — equivalent to what :latest gives you, but with a
          # reproducible identity across reconciles.
          image: ghcr.io/gitroomhq/postiz-app:v2.21.10
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          # IS_GENERAL=true unlocks the Settings → Developers tab (the frontend
          # gates public-api/Apps UI on process.env.IS_GENERAL). Matches what the
          # upstream docker-compose.yaml:16 sets. Backend endpoints already work
          # without it; this just restores the UI to create/rotate API keys.
          env:
            - name: IS_GENERAL
              value: "true"
          envFrom:
            - secretRef:
                name: postiz-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              # Sized for 3 Node processes (backend + frontend + orchestrator)
              # plus Prisma first-run schema push which spikes to ~3Gi during
              # the initial db push on a fresh database. 4Gi gives headroom.
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            # nginx on :5000 is the public surface — probe that.
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: uploads
              mountPath: /uploads
            - name: config
              mountPath: /config
        # Sidecar: openai-rewrite-proxy. Postiz's openai-node SDK reads
        # process.env.OPENAI_BASE_URL (set below to http://localhost:8080/v1),
        # so every chat/image call hits this sidecar. The sidecar rewrites
        # Postiz's hardcoded 'model' field to an OpenRouter-compatible
        # namespace (gpt-4.1 → minimax/minimax-m3, chatgpt-image-latest →
        # openai/gpt-image-1) and forwards to OpenRouter. This keeps the
        # upstream postiz-app image untouched so version bumps don't require
        # re-porting patches. See postiz-ai-proxy-configmap.yaml for the
        # rewrite map and proxy code.
        - name: openai-rewrite-proxy
          image: node:20-alpine
          imagePullPolicy: IfNotPresent
          workingDir: /proxy
          command: ["node", "server.js"]
          ports:
            - name: proxy
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: postiz-secrets
          env:
            # Force the URL the sidecar listens on, overriding any
            # OPENAI_BASE_URL from the secret (which is the *pod-level*
            # setting for the postiz container; the sidecar doesn't need
            # to know about OpenRouter's URL except via its own logic).
            - name: OPENAI_BASE_URL
              value: "http://localhost:8080/v1"
            - name: OPENAI_REFERER
              value: "https://postiz.rubiconetic.com"
            - name: OPENAI_TITLE
              value: "Postiz"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: proxy
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: proxy
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: ai-proxy-out
              mountPath: /proxy
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: postiz-uploads-pvc
        - name: config
          persistentVolumeClaim:
            claimName: postiz-config-pvc
        - name: ai-proxy-src
          configMap:
            name: postiz-ai-proxy
            defaultMode: 0o755
        - name: ai-proxy-out
          emptyDir:
            sizeLimit: 256Mi