# Postgres 17 for the Postiz app database.
# Prisma stores schema + scheduled-posts history + media metadata here.
# Recreate strategy because the data dir is a Longhorn RWO mount.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postiz-postgres-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postiz-postgres
  namespace: default
spec:
  selector:
    app: postiz-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postiz-postgres
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postiz-postgres
  template:
    metadata:
      labels:
        app: postiz-postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postiz-db-secrets
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postiz", "-d", "postiz"]
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postiz", "-d", "postiz"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postiz-postgres-pvc