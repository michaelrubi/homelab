# Redis 7 for Postiz queue/cache/throttler.
# AUTH-enabled, password pulled from postiz-redis-secrets.
# No AOF persistence — Redis here is a queue, not a source of truth.
# 2026-10-24: so it gets an emptyDir, not a Longhorn volume. With --save ""
# and --appendonly no nothing was ever written to the old 1Gi PVC, yet it was
# still snapshotted and backed up to NFS every night. Flux prunes the PVC.
---
apiVersion: v1
kind: Service
metadata:
  name: postiz-redis
  namespace: default
spec:
  selector:
    app: postiz-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postiz-redis
  namespace: default
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: postiz-redis
  template:
    metadata:
      labels:
        app: postiz-redis
    spec:
      securityContext:
        fsGroup: 999
        # See the fsGroup note in manifests/kustomization.yaml.
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: redis
          image: redis:7.2-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server"]
          args:
            - --requirepass
            - $(REDIS_PASSWORD)
            - --save
            - ""
            - --appendonly
            - "no"
          envFrom:
            - secretRef:
                name: postiz-redis-secrets
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
          # Probe exec commands do not get $(VAR) expansion (only command/args
          # do), so the old ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"]
          # sent that literal string as the password. Expand it in a shell,
          # and require PONG rather than trusting redis-cli's exit code,
          # which is 0 for a NOAUTH error reply too.
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}