# Same Longhorn version as production, so the drill proves the backups can be
# read by the software that wrote them. One replica: the cluster lives for
# hours and redundancy would only slow the restore.
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: longhorn
      version: 1.10.1
      sourceRef:
        kind: HelmRepository
        name: longhorn
  values:
    persistence:
      defaultClassReplicaCount: 1
    preUpgradeChecker:
      jobEnabled: false
    defaultBackupStore:
      # ClusterIP of drill-backupstore in ../store/backupstore.yaml.
      backupTarget: nfs://172.20.200.50:/opt/backupstore
      pollInterval: 60
