# Flux config for the temporary EKS restore cluster. Nothing in clusters/drill
# is reconciled by production, which only watches clusters/my-cluster.
#
# Applied by hand after `flux install`, deliberately not with `flux bootstrap`:
# bootstrap commits to the repo and adds a deploy key. This reads the public
# GitHub mirror over HTTPS with no credentials, so the drill cannot write back.
#
# There is no sops decryption here either. The age key stays off this cluster,
# and scripts/restore-drill.sh sends only the Secrets the drill needs.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/michaelrubi/homelab
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: drill-longhorn
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/drill/longhorn
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: homelab
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: drill-store
  namespace: flux-system
spec:
  dependsOn:
    - name: drill-longhorn
  interval: 10m
  path: ./clusters/drill/store
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: drill-apps
  namespace: flux-system
spec:
  dependsOn:
    - name: drill-longhorn
  interval: 10m
  path: ./clusters/drill/apps/core
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
---
# Suspended until the dump is loaded. Kaneo runs its migrations at startup, so
# starting it first would race the restore. `restore-drill.sh kaneo` resumes it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: drill-kaneo
  namespace: flux-system
spec:
  suspend: true
  dependsOn:
    - name: drill-apps
  interval: 10m
  path: ./clusters/drill/apps/kaneo
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
