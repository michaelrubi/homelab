# Validates every manifest before Flux can apply it.
#
# This repo is the cluster's source of truth and Flux reconciles within ~60s
# of a merge, so a malformed manifest reaches production faster than a human
# can notice. CI previously only echoed strings.
#
# Two checks:
#   1. kustomize build  -- catches a file missing from kustomization.yaml, a
#      broken patch, or unparseable YAML.
#   2. kubeconform      -- validates each resource against the Kubernetes
#      schema for the version this cluster runs.
#
# Secrets are skipped: they are SOPS-encrypted here and still carry a
# top-level `sops:` key that kustomize-controller strips at decrypt time, so
# they do not match the Secret schema until after Flux has processed them.
# CRDs (HelmRelease, PrometheusRule, ServiceMonitor, RecurringJob,
# BackupTarget) have no bundled schema, hence -ignore-missing-schemas.
name: validate-manifests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  KUSTOMIZE_VERSION: "5.5.0"
  KUBECONFORM_VERSION: "0.6.7"
  # Match the cluster: k3s v1.34.12.
  K8S_VERSION: "1.34.0"

jobs:
  validate:
    runs-on: docker
    steps:
      - name: Install tooling
        run: |
          set -eu
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin kustomize
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C /usr/local/bin kubeconform
          kustomize version
          kubeconform -v

      - uses: actions/checkout@v7

      - name: kustomize build
        run: |
          set -eu
          kustomize build manifests/ > /tmp/rendered.yaml
          echo "rendered $(grep -c '^kind:' /tmp/rendered.yaml) resources"

      - name: kubeconform
        run: |
          set -eu
          kubeconform \
            -kubernetes-version "${K8S_VERSION}" \
            -ignore-missing-schemas \
            -skip Secret \
            -strict \
            -summary \
            /tmp/rendered.yaml

      - name: Guard against plaintext credentials
        run: |
          set -eu
          # A live Postgres password was once committed inline in a Deployment
          # (fixed 2026-09-18). Credentials belong in secrets.sops.yaml.
          if grep -rnE '(postgres|postgresql|redis|mysql)://[^:@/[:space:]]+:[^@[:space:]]+@' manifests --include='*.yaml' \
               | grep -v 'ENC\[' | grep -v '\$(' | grep -v '{{'; then
            echo "::error::plaintext credential in a connection string -- move it into secrets.sops.yaml"
            exit 1
          fi
          echo "no plaintext connection-string credentials found"
